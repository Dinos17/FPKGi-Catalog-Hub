    .error { color:#fca5a5; text-align:center; padding:30px; }
  </style>

<body>
  <main class="wrap">
    <header>
      <h1>FPKGi Catalog Hub</h1>
      <p>Search and browse the FPKGi catalog.</p>
      <div class="search"><input id="search" type="search" placeholder="Search the catalog..." autocomplete="off"></div>
      <div id="categoryFilters" class="filters category-filters"></div>
      <div id="platformFilters" class="filters platform-filters"></div>
    </header>

    <section>
      <div class="meta"><span id="count">Loading…</span><span id="status"></span></div>
      <section id="details" class="details" hidden></section>
      <div id="results" class="grid"></div>
      <div id="pagination" class="pagination" aria-label="Catalog pages"></div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
const state = { records: [], category: "all", platform: "all", query: "", page: 1, pageSize: 48, selected: null };

const categoryLabels = {
  all: "All",
  games: "Games",
  apps: "Apps",
  dlc: "DLC",
  demos: "Demos",
  emulators: "Emulators",
  homebrew: "Homebrew",
  themes: "Themes",
  updates: "Updates",
  ps1: "PS1",
  ps2: "PS2",
  psp: "PSP"
};

function categoryForFile(file) {
  const name = file.toLowerCase().replace(/\.json$/, "");
  if (name.startsWith("ps5-")) {
    const base = name.slice(4);
    return categoryLabels[base] ? base : "other";
  }
  return categoryLabels[name] ? name : "other";
}

function platformForFile(file) {
  const name = file.toLowerCase();
  if (name.startsWith("ps5")) return "PS5";
  if (name === "ps1.json") return "PS1";
  if (name === "ps2.json") return "PS2";
  if (name === "psp.json") return "PSP";
  return "PS4";
}

function normalize(value) {
  return String(value ?? "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[\p{P}\p{S}]+/gu, " ")
    .replace(/\s+/g, " ")
    .toLowerCase()
    .trim();
}

let searchIndex = null;

function createSearchIndex() {
  searchIndex = new Fuse(
    state.records.map((record, index) => ({
      ...record.data,
      __recordIndex: index
    })),
    {
      includeScore: true,
      ignoreLocation: true,
      threshold: 0.42,
      distance: 100,
      minMatchCharLength: 1,
      findAllMatches: true,
      ignoreFieldNorm: false,
      keys: [
        { name: "name", weight: 0.78 },
        { name: "title_id", weight: 0.20 },
        { name: "region", weight: 0.01 },
        { name: "version", weight: 0.01 }
      ],
      getFn: (object, path) => normalize(object[path])
    }
  );
}

function editDistance(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const curr = [i];
    for (let j = 1; j <= b.length; j++) {
      curr[j] = Math.min(
        curr[j - 1] + 1,
        prev[j] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
    for (let j = 0; j <= b.length; j++) prev[j] = curr[j];
  }
  return prev[b.length];
}

function tokenMatchScore(queryToken, textToken) {
  if (queryToken === textToken) return 1;
  if (textToken.startsWith(queryToken)) return 0.94;
  if (textToken.includes(queryToken)) return 0.80;

  // Numeric tokens are strict: "1" must not fuzzy-match "2".
  const queryIsNumeric = /^\d+(?:\.\d+)?$/.test(queryToken);
  const textIsNumeric = /^\d+(?:\.\d+)?$/.test(textToken);
  if (queryIsNumeric || textIsNumeric) return 0;

  const maxDistance = queryToken.length <= 3 ? 1 : queryToken.length <= 6 ? 2 : 3;
  const distance = editDistance(queryToken, textToken);
  if (distance > maxDistance) return 0;

  return Math.max(0.45, 1 - distance / Math.max(queryToken.length, textToken.length));
}

function scoreName(query, name) {
  const queryText = normalize(query);
  const nameText = normalize(name);
  if (!queryText || !nameText) return 0;

  if (nameText === queryText) return 1.00;
  if (nameText.startsWith(queryText)) return 0.98;
  if (nameText.includes(queryText)) return 0.96;

  const queryTokens = queryText.split(" ").filter(Boolean);
  const nameTokens = nameText.split(" ").filter(Boolean);
  if (!queryTokens.length || !nameTokens.length) return 0;

  let total = 0;
  let matched = 0;

  for (const queryToken of queryTokens) {
    let best = 0;
    for (const nameToken of nameTokens) {
      best = Math.max(best, tokenMatchScore(queryToken, nameToken));
    }
    if (best > 0) matched++;
    total += best;
  }

  const coverage = matched / queryTokens.length;
  const average = total / queryTokens.length;

  // Every query token must have a meaningful match.
  if (coverage < 1) return 0;

  // Multi-word queries need stronger aggregate similarity.
  if (queryTokens.length > 1 && average < 0.70) return 0;

  return average;
}

function getSearchMatches(query) {
  const normalizedQuery = normalize(query);
  if (!normalizedQuery) return state.records;

  if (!searchIndex) createSearchIndex();

  const exactMatches = state.records
    .map(record => {
      const name = normalize(record.data.name);
      const titleId = normalize(record.data.title_id);
      const nameScore = scoreName(normalizedQuery, record.data.name);
      const titleScore = titleId === normalizedQuery
        ? 1
        : titleId.startsWith(normalizedQuery)
          ? 0.98
          : 0;
      return { record, score: Math.max(nameScore, titleScore) };
    })
    .filter(item => item.score > 0)
    .sort((a, b) =>
      b.score - a.score ||
      normalize(a.record.data.name).localeCompare(normalize(b.record.data.name))
    );

  // If our semantic/token search found something, use it first.
  if (exactMatches.length) {
    return exactMatches.map(item => item.record);
  }

  // Fuse is now a fallback for genuine spelling mistakes.
  return searchIndex.search(normalizedQuery)
    .map(result => {
      const record = state.records[result.item.__recordIndex];
      return {
        record,
        score: result.score ?? 1,
        nameScore: scoreName(normalizedQuery, record.data.name)
      };
    })
    .filter(item => item.nameScore >= 0.58)
    .sort((a, b) =>
      b.nameScore - a.nameScore ||
      a.score - b.score ||
      normalize(a.record.data.name).localeCompare(normalize(b.record.data.name))
    )
    .map(item => item.record);
}

function buildCategoryFilters() {
  const container = document.getElementById("categoryFilters");
  container.innerHTML = Object.entries(categoryLabels)
    .map(([key, label]) =>
      '<button data-category="' + key + '">' + escapeHtml(label) + '</button>'
    ).join("");

  container.querySelector('[data-category="all"]').classList.add("active");

  container.querySelectorAll("[data-category]").forEach(button => {
    button.addEventListener("click", () => {
      container.querySelectorAll("[data-category]").forEach(b => b.classList.remove("active"));
      button.classList.add("active");
      state.category = button.dataset.category;
      state.page = 1;
      render();
    });
  });
}

function buildPlatformFilters() {
  const container = document.getElementById("platformFilters");

  container.innerHTML = ["PS4", "PS5"].map(platform =>
    '<button data-platform="' + platform + '">' + platform + '</button>'
  ).join("");

  container.querySelectorAll("[data-platform]").forEach(button => {
    button.classList.toggle("active", button.dataset.platform === state.platform);
    button.addEventListener("click", () => {
      state.platform = state.platform === button.dataset.platform ? "all" : button.dataset.platform;
      state.page = 1;
      container.querySelectorAll("[data-platform]").forEach(b =>
        b.classList.toggle("active", b.dataset.platform === state.platform)
      );
      render();
    });
  });
}

function render() {
  const q = state.query.trim();
  const searchMatches = getSearchMatches(q);

  const matches = searchMatches.filter(record => {
    if (state.category !== "all" && record.category !== state.category) return false;
    if (state.platform !== "all" && record.platform !== state.platform) return false;
    return true;
  });

  document.getElementById("count").textContent =
    matches.length.toLocaleString() + (state.category === "all" ? " items" : " " + (categoryLabels[state.category] || "items"));

  const results = document.getElementById("results");
  if (!matches.length) {
    results.innerHTML = '<div class="empty">No items found.</div>';
    document.getElementById("pagination").innerHTML = "";
    return;
  }

  results.innerHTML = matches.slice((state.page - 1) * state.pageSize, state.page * state.pageSize).map(record => {
    const game = record.data;
    const size = Number(game.size);
    const sizeText = Number.isFinite(size) && size > 0
      ? (size / 1073741824).toFixed(1) + " GB"
      : "Size unavailable";

    return `
      <article class="card" data-index="${state.records.indexOf(record)}" tabindex="0" role="button">
        <span class="platform">${escapeHtml(record.platform)}</span>
        <h2>${escapeHtml(game.name || "Unknown title")}</h2>
        <p>${escapeHtml(game.title_id || "No Title ID")}</p>
        <p>${escapeHtml(game.region || "Region unknown")} · ${escapeHtml(game.version || "Version unknown")}</p>
        <p>${sizeText}</p>
      </article>`;
  }).join("");

  results.querySelectorAll(".card").forEach(card => {
    const record = state.records[Number(card.dataset.index)];
    card.addEventListener("click", () => openDetails(record));
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openDetails(record);
      }
    });
  });

  renderPagination(Math.ceil(matches.length / state.pageSize));
}

function openDetails(record) {
  state.selected = record;
  const game = record.data;
  const details = document.getElementById("details");
  details.innerHTML = '<div class="detail-modal" role="dialog" aria-modal="true" aria-label="' + escapeHtml(game.name || "Game details") + '">' +
    '<button class="detail-close" id="detailClose" aria-label="Close">×</button>' +
    '<div class="detail-hero"><div class="detail-glow"></div><div class="detail-content">' +
    '<span class="detail-platform">' + escapeHtml(record.platform) + '</span>' +
    '<h2>' + escapeHtml(game.name || "Unknown title") + '</h2>' +
    '<p class="detail-subtitle">' + escapeHtml(game.title_id || "No Title ID") + ' · ' + escapeHtml(game.region || "Region unknown") + ' · ' + escapeHtml(game.version || "Version unknown") + '</p>' +
    '<p class="detail-description">' + escapeHtml(game.description || game.desc || "No description is available for this title yet.") + '</p>' +
    '</div></div>' +
    '<div class="detail-info"><div><span>Title ID</span><strong>' + escapeHtml(game.title_id || "—") + '</strong></div>' +
    '<div><span>Region</span><strong>' + escapeHtml(game.region || "—") + '</strong></div>' +
    '<div><span>Version</span><strong>' + escapeHtml(game.version || "—") + '</strong></div>' +
    '<div><span>Size</span><strong>' + (Number.isFinite(Number(game.size)) && Number(game.size) > 0 ? (Number(game.size) / 1073741824).toFixed(1) + " GB" : "Size unavailable") + '</strong></div></div></div>';
  details.hidden = false;
  document.getElementById("detailClose").addEventListener("click", closeDetails);
  details.addEventListener("click", event => { if (event.target === details) closeDetails(); }, { once:true });
  document.addEventListener("keydown", handleDetailEscape);
}

function handleDetailEscape(event) {
  if (event.key === "Escape" && state.selected) closeDetails();
}

function closeDetails() {
  state.selected = null;
  document.getElementById("details").hidden = true;
  document.removeEventListener("keydown", handleDetailEscape);
}

function renderPagination(pageCount) {
  const container = document.getElementById("pagination");
  if (pageCount <= 1) { container.innerHTML = ""; return; }
  const pages = [];
  const add = (page, label, active, disabled) => pages.push("<button class=\"page-btn" + (active ? " active" : "") + "\" data-page=\"" + page + "\"" + (disabled ? " disabled" : "") + ">" + label + "</button>");
  add(state.page - 1, "‹", false, state.page === 1);
  const visible = [...new Set([1, state.page - 1, state.page, state.page + 1, pageCount])].filter(p => p >= 1 && p <= pageCount).sort((a,b) => a-b);
  let last = 0;
  visible.forEach(page => { if (last && page - last > 1) pages.push("<span class=\"page-gap\">…</span>"); add(page, String(page), page === state.page, false); last = page; });
  add(state.page + 1, "›", false, state.page === pageCount);
  container.innerHTML = pages.join("");
  container.querySelectorAll("[data-page]").forEach(button => button.addEventListener("click", () => { const page = Number(button.dataset.page); if (page < 1 || page > pageCount || page === state.page) return; state.page = page; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[ch]));
}

document.getElementById("search").addEventListener("input", event => {
  state.query = event.target.value;
  state.page = 1;
  render();
});

const REPO_RAW = "https://raw.githubusercontent.com/Dinos17/FPKGi-Catalog-Hub/main/";

const catalogFiles = [
  "ps4/games.json", "ps4/apps.json", "ps4/updates.json", "ps4/dlc.json",
  "ps4/demos.json", "ps4/homebrew.json", "ps4/emulators.json", "ps4/themes.json",
  "ps4/ps1.json", "ps4/ps2.json", "ps4/psp.json",
  "ps5/ps5-games.json", "ps5/ps5-apps.json", "ps5/ps5-updates.json",
  "ps5/ps5-dlc.json", "ps5/ps5-demos.json", "ps5/ps5-homebrew.json",
  "ps5/ps5-emulators.json", "ps5/ps5-themes.json",
  "ps5/ps1.json", "ps5/ps2.json", "ps5/psp.json"
];

async function loadCatalogsLive() {
  const responses = await Promise.all(catalogFiles.map(async file => {
    const response = await fetch(REPO_RAW + file + "?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error(file + " returned " + response.status);
    return { file, data: await response.json() };
  }));

  const records = [];
  for (const { file, data } of responses) {
    const category = categoryForFile(file.split("/").pop());
    const platform = platformForFile(file.split("/").pop());
    const entries = data && typeof data.DATA === "object" ? data.DATA : {};

    for (const [url, game] of Object.entries(entries)) {
      if (game && typeof game === "object") {
        records.push({ url, data: game, category, platform });
      }
    }
  }

  return records;
}

loadCatalogsLive()
  .then(records => {
    state.records = records;

    // A package URL is the catalog record identity, so the dashboard
    // must never render the same package twice.
    const uniqueRecords = new Map();
    for (const record of state.records) {
      const key = record && record.url || JSON.stringify(record && record.data || record);
      if (!uniqueRecords.has(key)) uniqueRecords.set(key, record);
    }
    state.records = [...uniqueRecords.values()];

    if (!state.records.length) throw new Error("Catalog data contains 0 records.");
    createSearchIndex();
    buildCategoryFilters();
    buildPlatformFilters();
    document.getElementById("status").textContent = "Live catalog loaded";
    render();
  })
  .catch(error => {
    document.getElementById("count").textContent = "Catalog unavailable";
    document.getElementById("status").textContent = "";
    document.getElementById("results").innerHTML =
      '<div class="error">Could not load the live catalog.<br>' + escapeHtml(error.message) + '</div>';
  });
</script>
</body>
</html>
