<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPKGi Catalog Hub</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d10; --panel:#151922; --panel2:#1b202b; --text:#f4f6f8; --muted:#9aa4b2; --accent:#5eead4; --border:#2a3140; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(180deg,#0b0d10 0%,#10141b 100%); color:var(--text); }
    .wrap { max-width:1100px; margin:auto; padding:48px 20px 64px; }
    header { text-align:center; margin-bottom:34px; }
    h1 { margin:0 0 10px; font-size:clamp(2rem,5vw,3.4rem); letter-spacing:-.04em; }
    header p { margin:0; color:var(--muted); }
    .search { margin:30px auto 18px; max-width:760px; }
    input { width:100%; padding:17px 20px; border:1px solid var(--border); border-radius:14px; background:var(--panel); color:var(--text); font-size:1.05rem; outline:none; }
    input:focus { border-color:var(--accent); }
    .filters { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }\n    .platform-filters { margin-bottom:32px; }
    button { border:1px solid var(--border); background:var(--panel); color:var(--text); padding:10px 16px; border-radius:999px; cursor:pointer; }
    button:hover, button.active { background:var(--panel2); border-color:var(--accent); color:var(--accent); }
    .meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); margin-bottom:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
    .card { position:relative; background:rgba(21,25,34,.9); border:1px solid var(--border); border-radius:16px; padding:18px; min-height:130px; }
    .platform { position:absolute; top:12px; right:12px; padding:4px 7px; border:1px solid var(--border); border-radius:7px; background:#202733; color:#fff; font-size:.68rem; font-weight:800; letter-spacing:.04em; }
    .card h2 { margin:0 70px 10px 0; font-size:1.05rem; }
    .card p { margin:5px 0; color:var(--muted); font-size:.9rem; }
    .empty { text-align:center; color:var(--muted); padding:50px 10px; }
    .error { color:#fca5a5; text-align:center; padding:30px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>FPKGi Catalog Hub</h1>
      <p>Search and browse the catalog.</p>
      <div class="search"><input id="search" type="search" placeholder="Search the catalog..." autocomplete="off"></div>
      <div id="categoryFilters" class="filters"></div>
      <div id="platformFilters" class="filters platform-filters"></div>
    </header>

    <section>
      <div class="meta"><span id="count">Loading…</span><span id="status"></span></div>
      <div id="results" class="grid"></div>
    </section>
  </main>

<script>
const state = { records: [], category: "all", platform: "all", query: "" };

const categoryLabels = {
  all: "All",
  games: "Games",
  apps: "Apps",
  dlc: "DLC",
  demos: "Demos",
  emulators: "Emulators",
  homebrew: "Homebrew",
  themes: "Themes",
  updates: "Updates",
  ps1: "PS1",
  ps2: "PS2",
  psp: "PSP"
};

function categoryForFile(file) {
  const name = file.toLowerCase().replace(/\.json$/, "");
  if (name.startsWith("ps5-")) {
    const base = name.slice(4);
    return categoryLabels[base] ? base : "other";
  }
  return categoryLabels[name] ? name : "other";
}

function platformForFile(file) {
  const name = file.toLowerCase();
  if (name.startsWith("ps5")) return "PS5";
  if (name === "ps1.json") return "PS1";
  if (name === "ps2.json") return "PS2";
  if (name === "psp.json") return "PSP";
  return "PS4";
}

function normalize(value) {
  return String(value ?? "").toLowerCase().trim();
}

function buildCategoryFilters() {
  const container = document.getElementById("categoryFilters");
  container.innerHTML = Object.entries(categoryLabels)
    .map(([key, label]) =>
      '<button data-category="' + key + '">' + escapeHtml(label) + '</button>'
    ).join("");

  container.querySelector('[data-category="all"]').classList.add("active");

  container.querySelectorAll("[data-category]").forEach(button => {
    button.addEventListener("click", () => {
      container.querySelectorAll("[data-category]").forEach(b => b.classList.remove("active"));
      button.classList.add("active");
      state.category = button.dataset.category;
      render();
    });
  });
}

function buildPlatformFilters() {
  const container = document.getElementById("platformFilters");

  container.innerHTML = ["PS4", "PS5"].map(platform =>
    '<button data-platform="' + platform + '">' + platform + '</button>'
  ).join("");

  container.querySelectorAll("[data-platform]").forEach(button => {
    button.classList.toggle("active", button.dataset.platform === state.platform);
    button.addEventListener("click", () => {
      state.platform = state.platform === button.dataset.platform ? "all" : button.dataset.platform;
      container.querySelectorAll("[data-platform]").forEach(b =>
        b.classList.toggle("active", b.dataset.platform === state.platform)
      );
      render();
    });
  });
}

function render() {
  const q = normalize(state.query);

  const matches = state.records.filter(record => {
    if (state.category !== "all" && record.category !== state.category) return false;
    if (state.platform !== "all" && record.platform !== state.platform) return false;

    const game = record.data;
    const text = normalize([game.name, game.title_id, game.region, game.version].join(" "));
    return !q || text.includes(q);
  });

  document.getElementById("count").textContent =
    matches.length.toLocaleString() + (state.category === "all" ? " items" : " " + (categoryLabels[state.category] || "items"));

  const results = document.getElementById("results");
  if (!matches.length) {
    results.innerHTML = '<div class="empty">No items found.</div>';
    return;
  }

  results.innerHTML = matches.slice(0, 100).map(record => {
    const game = record.data;
    const size = Number(game.size);
    const sizeText = Number.isFinite(size) && size > 0
      ? (size / 1073741824).toFixed(1) + " GB"
      : "Size unavailable";

    return `
      <article class="card">
        <span class="platform">${escapeHtml(record.platform)}</span>
        <h2>${escapeHtml(game.name || "Unknown title")}</h2>
        <p>${escapeHtml(game.title_id || "No Title ID")}</p>
        <p>${escapeHtml(game.region || "Region unknown")} · ${escapeHtml(game.version || "Version unknown")}</p>
        <p>${sizeText}</p>
      </article>`;
  }).join("");
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[ch]));
}

document.getElementById("search").addEventListener("input", event => {
  state.query = event.target.value;
  render();
});

fetch("catalog-manifest.json")
  .then(response => {
    if (!response.ok) throw new Error("catalog-manifest.json returned " + response.status);
    return response.json();
  })
  .then(files => Promise.all(
    files.map(file =>
      fetch(file)
        .then(response => {
          if (!response.ok) throw new Error(file + " returned " + response.status);
          return response.json();
        })
        .then(catalog =>
          Object.values(catalog.DATA || {}).map(game => ({
            data: game,
            category: categoryForFile(file),
            platform: platformForFile(file)
          }))
        )
    )
  ))
  .then(groups => {
    state.records = groups.flat();
    buildCategoryFilters();
    buildPlatformFilters();
    document.getElementById("status").textContent = "Catalog loaded";
    render();
  })
  .catch(error => {
    document.getElementById("count").textContent = "Catalog unavailable";
    document.getElementById("status").textContent = "";
    document.getElementById("results").innerHTML =
      '<div class="error">Could not load the catalog.<br>' + escapeHtml(error.message) + '</div>';
  });
</script>
</body>
</html>
