# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare dashboard data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalogs = []
          total = 0

          category_labels = {
              "games", "apps", "dlc", "demos", "emulators",
              "homebrew", "themes", "updates", "ps1", "ps2", "psp"
          }

          for path in sorted(Path("ps4").glob("*.json")) + sorted(Path("ps5").glob("*.json")):
              if path.name == "new-registrations.json":
                  continue

              name = path.stem.lower()
              if name.startswith("ps5-"):
                  category = name[4:] if name[4:] in category_labels else "other"
              else:
                  category = name if name in category_labels else "other"

              platform = "PS5" if path.parent.name.lower() == "ps5" and name.startswith("ps5") else (
                  "PS1" if name == "ps1" else
                  "PS2" if name == "ps2" else
                  "PSP" if name == "psp" else
                  "PS4"
              )

              data = json.loads(path.read_text(encoding="utf-8")).get("DATA", {})
              for game in data.values():
                  if isinstance(game, dict):
                      catalogs.append({
                          "data": game,
                          "category": category,
                          "platform": platform
                      })
                      total += 1

          Path("dashboard/catalog-data.json").write_text(
              json.dumps(catalogs, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )

          print(f"Dashboard records: {total}")
          if total == 0:
              raise SystemExit("Dashboard data generation produced 0 records.")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
