name: AkiraBox Scan and Safe Replacement PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test and scanner dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest==8.4.2"

      - name: Run tests
        run: python -m pytest -q

      - name: Scan configured public folder metadata (read-only)
        run: python tools/akirabox_scanner.py --config config/akirabox_sources.json --output akirabox-scan-report.json

      - name: Add scan generation timestamp
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("akirabox-scan-report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          report["generated_at"] = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          path.write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Compare scan with GitHub catalogs (read-only)
        run: python tools/akirabox_catalog_compare.py --scan-report akirabox-scan-report.json --catalog-root . --output akirabox-comparison-report.json

      - name: Apply strictly verified safe replacements
        run: |
          python tools/akirabox_apply_safe_replacements.py \
            --scan-report akirabox-scan-report.json \
            --comparison-report akirabox-comparison-report.json \
            --catalog-root . \
            --output akirabox-safe-replacements.json

      - name: Open a pull request for safe catalog replacements
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          applied="$(jq -r '.applied_count' akirabox-safe-replacements.json)"
          if [ "$applied" -eq 0 ]; then
            echo "No safe catalog replacements to process."
            exit 0
          fi
          branch="automation/akirabox-safe-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add ps4/games.json ps4/dlc.json ps5/ps5-games.json ps5/ps5-dlc.json
          if git diff --cached --quiet; then
            echo "No catalog changes were produced."
            exit 0
          fi
          git commit -m "Apply $applied safe AkiraBox URL replacement(s)"
          git push origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Apply $applied safe AkiraBox URL replacement(s)" \
            --body "## Automated safe replacements

          This PR was generated by the AkiraBox scan workflow.

          Only URL keys are replaced. Catalog metadata values are preserved.
          Each replacement passed the strict safe checks: exact title, region, version, platform/category and file size; no reported metadata differences; a unique scanned filename; HTTPS AkiraBox destination; and the original catalog record still matched at apply time.

          No manual-review, duplicate, new, or unclassified entries are changed.

          Review the diff before merging."
          echo "Created catalog update PR for $applied safe replacement(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest reports for the review dashboard
        if: success()
        env:
          REPORT_BRANCH: akirabox-reports
        run: |
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/akirabox-report-publication"
          git worktree add --detach "$publication_dir" HEAD
          git -C "$publication_dir" fetch origin "$REPORT_BRANCH:refs/remotes/origin/$REPORT_BRANCH" || true
          if git -C "$publication_dir" show-ref --verify --quiet "refs/remotes/origin/$REPORT_BRANCH"; then
            git -C "$publication_dir" switch --force-create "$REPORT_BRANCH" "origin/$REPORT_BRANCH"
          else
            git -C "$publication_dir" switch --orphan "$REPORT_BRANCH"
          fi
          mkdir -p "$publication_dir/reports"
          cp akirabox-scan-report.json akirabox-comparison-report.json akirabox-safe-replacements.json "$publication_dir/reports/"
          git -C "$publication_dir" config user.name "github-actions[bot]"
          git -C "$publication_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publication_dir" add reports/akirabox-scan-report.json reports/akirabox-comparison-report.json reports/akirabox-safe-replacements.json
          if git -C "$publication_dir" diff --cached --quiet; then
            echo "Latest reports are already published."
          else
            git -C "$publication_dir" commit -m "Publish latest AkiraBox scan reports"
            git -C "$publication_dir" push origin "HEAD:$REPORT_BRANCH"
          fi

      - name: Display scan and comparison reports
        if: always()
        run: |
          for report in akirabox-scan-report.json akirabox-comparison-report.json akirabox-safe-replacements.json; do
            if [ -f "$report" ]; then
              echo "## AkiraBox report: $report" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              cat "$report" | tee -a "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
