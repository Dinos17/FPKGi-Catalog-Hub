name: AkiraBox Read-Only Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install scanner dependency
        run: python -m pip install requests

      - name: Scan configured public folder metadata (read-only)
        run: |
          python tools/akirabox_scanner.py \
            --config config/akirabox_sources.json \
            --output akirabox-scan-report.json

      - name: Upload scan report
        if: always() && hashFiles('akirabox-scan-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: akirabox-scan-report
          path: akirabox-scan-report.json
          if-no-files-found: error
