name: AkiraBox Scan and Rejection Review

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  issues:
    types: [opened]

concurrency:
  group: akirabox-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install scanner and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest==8.4.2"

      - name: Run repository tests
        run: python -m pytest -q

      - name: Scan configured AkiraBox folders (read-only)
        run: python tools/akirabox_scanner.py --config config/akirabox_sources.json --output "$RUNNER_TEMP/akirabox-scan-report.json"

      - name: Add scan generation timestamp
        env:
          SCAN_REPORT: ${{ runner.temp }}/akirabox-scan-report.json
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["SCAN_REPORT"])
          report = json.loads(path.read_text(encoding="utf-8"))
          report["generated_at"] = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          path.write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Compare scan with GitHub catalogs (read-only)
        run: python tools/akirabox_catalog_compare.py --scan-report "$RUNNER_TEMP/akirabox-scan-report.json" --catalog-root . --output "$RUNNER_TEMP/akirabox-comparison-report.json"

      - name: Publish scan reports to the reports branch only
        env:
          REPORT_BRANCH: akirabox-reports
        run: |
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/akirabox-report-publication"
          git fetch origin "$REPORT_BRANCH:refs/remotes/origin/$REPORT_BRANCH"
          git worktree add --detach "$publication_dir" "origin/$REPORT_BRANCH"
          mkdir -p "$publication_dir/reports"
          cp "$RUNNER_TEMP/akirabox-scan-report.json" "$RUNNER_TEMP/akirabox-comparison-report.json" "$publication_dir/reports/"
          git -C "$publication_dir" config user.name "github-actions[bot]"
          git -C "$publication_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publication_dir" add reports/akirabox-scan-report.json reports/akirabox-comparison-report.json
          if git -C "$publication_dir" diff --cached --quiet; then
            echo "Latest AkiraBox reports are already published."
          else
            git -C "$publication_dir" commit -m "Publish latest AkiraBox scan reports"
            git -C "$publication_dir" push origin "HEAD:$REPORT_BRANCH"
          fi

      - name: Display scan and comparison summary
        if: always()
        run: |
          for report in "$RUNNER_TEMP/akirabox-scan-report.json" "$RUNNER_TEMP/akirabox-comparison-report.json"; do
            if [ -f "$report" ]; then
              echo "## AkiraBox report: $(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              cat "$report" | tee -a "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "Catalog files and AkiraBox files are not modified by this workflow." >> "$GITHUB_STEP_SUMMARY"

  record-rejection:
    if: github.event_name == 'issues' && github.event.issue.user.login == 'Dinos17' && startsWith(github.event.issue.title, 'AkiraBox rejection:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prepare existing rejection records
        env:
          REPORT_BRANCH: akirabox-reports
          REPORT_PATH: ${{ runner.temp }}/akirabox-rejections.json
        run: |
          set -euo pipefail
          git fetch origin "$REPORT_BRANCH:refs/remotes/origin/$REPORT_BRANCH"
          if git cat-file -e "origin/$REPORT_BRANCH:reports/akirabox-rejections.json" 2>/dev/null; then
            git show "origin/$REPORT_BRANCH:reports/akirabox-rejections.json" > "$REPORT_PATH"
          fi

      - name: Validate and record the rejection
        env:
          EVENT_PATH: ${{ github.event_path }}
          REPORT_PATH: ${{ runner.temp }}/akirabox-rejections.json
        run: |
          set -euo pipefail
          python tools/akirabox_rejections.py \
            --event-path "$EVENT_PATH" \
            --report-path "$REPORT_PATH" \
            --expected-actor "Dinos17"

      - name: Publish rejection record to reports branch
        env:
          REPORT_BRANCH: akirabox-reports
          REPORT_PATH: ${{ runner.temp }}/akirabox-rejections.json
        run: |
          set -euo pipefail
          git switch --force-create "$REPORT_BRANCH" "origin/$REPORT_BRANCH"
          mkdir -p reports
          cp "$REPORT_PATH" reports/akirabox-rejections.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/akirabox-rejections.json
          if git diff --cached --quiet; then
            echo "Rejection record was already published."
          else
            git commit -m "Record rejected AkiraBox upload"
            git push origin "HEAD:$REPORT_BRANCH"
          fi

      - name: Confirm saved rejection on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Rejection recorded. The upload is now listed as **REJECTED — MANUAL DELETION REQUIRED** in the AkiraBox Review dashboard. No catalog entry or AkiraBox file was changed."
