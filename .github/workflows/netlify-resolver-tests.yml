name: Netlify Mocha Resolver Tests

on:
  push:
    branches:
      - feat/netlify-mocha-resolver
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "netlify/functions/**"
      - "tests/netlify-mocha.test.mjs"
      - "package.json"
      - ".github/workflows/netlify-resolver-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check published catalog endpoints
        run: |
          urls=(
            "https://dinos17.github.io/FPKGi-Catalog-Hub/ps4/games.json"
            "https://dinos17.github.io/FPKGi-Catalog-Hub/ps4/dlc.json"
            "https://dinos17.github.io/FPKGi-Catalog-Hub/ps5/ps5-games.json"
            "https://dinos17.github.io/FPKGi-Catalog-Hub/ps5/ps5-dlc.json"
          )
          for url in "${urls[@]}"; do
            status="$(curl --silent --show-error --max-time 15 --max-redirs 0 \
              -o /dev/null -w "%{http_code}" "$url" || true)"
            printf "Published catalog HTTP %s: %s\\n" "$status" "$url"
          done
          curl --silent --show-error --max-time 15 --max-redirs 0 \
            -o "$RUNNER_TEMP/ps4-games.json" \
            "https://dinos17.github.io/FPKGi-Catalog-Hub/ps4/games.json"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "ps4-games.json")
          with open(path, encoding="utf-8") as stream:
              data = json.load(stream)
          file_id = "d5ac3913-802b-4d68-9803-8f5c07c7640e"
          print("Published PS4 games catalog contains Mocha smoke fixture:", file_id in data.get("DATA", {}))
          PY
      - name: Probe production resolver without exposing response content
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --max-time 10 --max-redirs 0 \
              -o "$RUNNER_TEMP/resolver-response.json" -w "%{http_code}" \
              "https://fpkgi-mocha-resolver.netlify.app/presigned?fileId=d5ac3913-802b-4d68-9803-8f5c07c7640e&diagnostics=1" || true)"
            printf "Production resolver HTTP %s (attempt %s/6)\n" "$status" "$attempt"
            if [ "$status" = "200" ]; then
              rm -f "$RUNNER_TEMP/resolver-response.json"
              exit 0
            fi
            RESOLVER_RESPONSE="$RUNNER_TEMP/resolver-response.json" node <<'NODE'
          const fs = require("node:fs");
          try {
            const body = JSON.parse(fs.readFileSync(process.env.RESOLVER_RESPONSE, "utf8"));
            console.log(JSON.stringify({
              error: body.error ?? null,
              diagnostics: body.diagnostics ?? null,
            }));
          } catch {
            console.log("Resolver returned no readable diagnostic payload.");
          }
          NODE
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          rm -f "$RUNNER_TEMP/resolver-response.json"
