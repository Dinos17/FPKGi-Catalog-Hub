name: Netlify Mocha Resolver Tests

on:
  push:
    branches:
      - feat/netlify-mocha-resolver
      - main
  pull_request:
    branches:
      - main
    paths:
      - "netlify/functions/**"
      - "tests/netlify-mocha.test.mjs"
      - "package.json"
      - ".github/workflows/netlify-resolver-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Probe production resolver without exposing response content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          curl --silent --show-error --max-time 15 --max-redirs 0 \
            -o /dev/null -w "Production resolver HTTP %{http_code}\\n" \
            "https://fpkgi-mocha-resolver.netlify.app/presigned?fileId=d5ac3913-802b-4d68-9803-8f5c07c7640e"
