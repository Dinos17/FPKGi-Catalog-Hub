name: Mocha Scan, Duplicate Review, and Verified PKG Metadata Repair

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: mocha-catalog-scan
  queue: max

permissions:
  contents: read

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest==8.4.2"

      - name: Run repository tests
        run: python -m pytest -q

  scan:
    if: github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      summary_json: ${{ steps.export.outputs.summary_json }}
    steps:
      - name: Check out the exact workflow and catalog commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Create isolated Mocha runtime
        run: python -m venv "$RUNNER_TEMP/mocha-venv"

      - name: Install hash-verified Mocha dependencies
        run: |
          "$RUNNER_TEMP/mocha-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes \
            -r tools/mocha-requirements.lock

      - name: Scan Mocha folders and file metadata
        env:
          MOCHA_API_KEY: ${{ secrets.MOCHA_API_KEY }}
        run: |
          "$RUNNER_TEMP/mocha-venv/bin/python" tools/mocha_scanner.py --output "$RUNNER_TEMP/mocha-scan-report.json"

      - name: Create sanitized public inventory artifact
        id: public_inventory
        if: always()
        env:
          SCAN_REPORT: ${{ runner.temp }}/mocha-scan-report.json
          PUBLIC_INVENTORY: ${{ runner.temp }}/mocha-public-inventory.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          source = Path(os.environ['SCAN_REPORT'])
          try:
              scan = json.loads(source.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError, UnicodeDecodeError) as exc:
              raise SystemExit(f'Cannot create inventory artifact: {exc}')
          if not isinstance(scan, dict) or scan.get('scanner') != 'mocha' or scan.get('scan_complete') is not True:
              raise SystemExit('Refusing to create an artifact from an incomplete scan.')
          files = scan.get('files')
          if not isinstance(files, list) or type(scan.get('file_count')) is not int or scan['file_count'] != len(files):
              raise SystemExit('Invalid inventory file count.')
          approved_paths = {
              "ps4/games": ("PS4", "games"),
              "ps4/dlc": ("PS4", "dlc"),
              "ps5/games": ("PS5", "games"),
              "ps5/dlc": ("PS5", "dlc"),
          }
          public_files = []
          for item in files:
              if not isinstance(item, dict): raise SystemExit('Invalid inventory entry.')
              name, folder = item.get('name'), item.get('folder_path')
              size, created = item.get('size_bytes'), item.get('created_at')
              platform, category, extension = item.get('platform'), item.get('catalog_category'), item.get('extension')
              if not isinstance(name, str) or not name or not isinstance(folder, str): raise SystemExit('Invalid name or folder.')
              if size is not None and (type(size) is not int or size < 0): raise SystemExit('Invalid size.')
              if created is not None and not isinstance(created, str): raise SystemExit('Invalid upload timestamp.')
              if any(v is not None and not isinstance(v, str) for v in (platform, category, extension)): raise SystemExit('Invalid classification.')
              approved_classification = approved_paths.get(folder.strip("/").casefold())
              if approved_classification is None or (platform, category) != approved_classification:
                  continue
              public_files.append({'name':name,'folder_path':folder,'size_bytes':size,'created_at':created,'platform':platform,'catalog_category':category,'extension':extension})
          approved_folders = {
              entry["path"].strip("/").casefold()
              for entry in scan.get("folders", [])
              if isinstance(entry, dict)
              and isinstance(entry.get("path"), str)
              and entry["path"].strip("/").casefold() in approved_paths
          }
          public = {'schema_version':1,'scanner':'mocha','scan_observed_at':scan.get('scan_observed_at'),'file_count':len(public_files),'files':public_files}
          if not isinstance(public['scan_observed_at'], str): raise SystemExit('Missing scan timestamp.')
          Path(os.environ['PUBLIC_INVENTORY']).write_text(json.dumps(public, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"file_count={len(public_files)}\n")
              output.write(f"folder_count={len(approved_folders)}\n")
          PY

      - name: Upload sanitized Mocha inventory artifact (public repository)
        id: inventory_upload
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mocha-file-inventory
          path: ${{ runner.temp }}/mocha-public-inventory.json
          if-no-files-found: error
          retention-days: 1

      - name: Compare against catalogs from the same commit
        run: |
          "$RUNNER_TEMP/mocha-venv/bin/python" tools/mocha_catalog_compare.py \
            --scan-report "$RUNNER_TEMP/mocha-scan-report.json" \
            --catalog-root . \
            --catalog-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/mocha-comparison-report.json"

      - name: Restrict raw reports to approved catalog folders
        if: always()
        env:
          SCAN_REPORT: ${{ runner.temp }}/mocha-scan-report.json
          COMPARISON_REPORT: ${{ runner.temp }}/mocha-comparison-report.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          scan_path = Path(os.environ["SCAN_REPORT"])
          comparison_path = Path(os.environ["COMPARISON_REPORT"])
          approved = {
              "ps4/games": ("PS4", "games"),
              "ps4/dlc": ("PS4", "dlc"),
              "ps5/games": ("PS5", "games"),
              "ps5/dlc": ("PS5", "dlc"),
          }
          try:
              scan = json.loads(scan_path.read_text(encoding="utf-8"))
              comparison = json.loads(comparison_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Raw report filtering failed: {exc}")
          if not isinstance(scan, dict) or not isinstance(comparison, dict):
              raise SystemExit("Raw reports must be JSON objects.")
          files = scan.get("files")
          rows = comparison.get("results")
          if not isinstance(files, list) or not isinstance(rows, list):
              raise SystemExit("Raw reports have an unexpected schema.")
          public_files = []
          allowed_ids = set()
          for item in files:
              if not isinstance(item, dict):
                  raise SystemExit("Malformed scan file entry.")
              folder = item.get("folder_path")
              classification = approved.get(folder.strip("/").casefold()) if isinstance(folder, str) else None
              if classification is None or (item.get("platform"), item.get("catalog_category")) != classification:
                  continue
              public_files.append(item)
              allowed_ids.add(str(item.get("id")))
          public_rows = [row for row in rows if isinstance(row, dict) and str(row.get("file_id")) in allowed_ids]
          count_keys = ("matched", "metadata_difference", "unverified", "new", "ambiguous", "unclassified")
          counts = {key: 0 for key in count_keys}
          for row in public_rows:
              status = row.get("status")
              if status in counts:
                  counts[status] += 1
          duplicates = []
          for group in comparison.get("possible_duplicates", []):
              if not isinstance(group, dict):
                  continue
              ids = [str(value) for value in group.get("file_ids", []) if str(value) in allowed_ids]
              if len(ids) > 1:
                  group = dict(group)
                  group["file_ids"] = ids
                  duplicates.append(group)
          counts["possible_duplicate"] = len(duplicates)
          scan["files"] = public_files
          scan["file_count"] = len(public_files)
          scan["folder_count"] = sum(
              1 for folder in scan.get("folders", [])
              if isinstance(folder, dict)
              and isinstance(folder.get("path"), str)
              and folder["path"].strip("/").casefold() in approved
          )
          comparison["results"] = public_rows
          comparison["possible_duplicates"] = duplicates
          comparison["counts"] = counts
          scan_path.write_text(json.dumps(scan, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          comparison_path.write_text(json.dumps(comparison, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Upload raw Mocha scan reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mocha-scan-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mocha-scan-report.json
            ${{ runner.temp }}/mocha-comparison-report.json
          if-no-files-found: warn
          retention-days: 1

      - name: Create sanitized dashboard summary
        id: export
        if: always()
        env:
          SCAN_REPORT: ${{ runner.temp }}/mocha-scan-report.json
          COMPARISON_REPORT: ${{ runner.temp }}/mocha-comparison-report.json
          CATALOG_COMMIT: ${{ github.sha }}
          PUBLIC_FILE_COUNT: ${{ steps.public_inventory.outputs.file_count }}
          PUBLIC_FOLDER_COUNT: ${{ steps.public_inventory.outputs.folder_count }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def read_json(name):
              path = Path(os.environ[name])
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return {}
              return value if isinstance(value, dict) else {}
          scan = read_json("SCAN_REPORT")
          comparison = read_json("COMPARISON_REPORT")
          counts_in = comparison.get("counts")
          counts = {}
          if isinstance(counts_in, dict):
              for key in ("matched", "metadata_difference", "unverified", "new",
                          "ambiguous", "unclassified", "possible_duplicate"):
                  value = counts_in.get(key)
                  counts[key] = value if type(value) is int and value >= 0 else None

          permissions_in = scan.get("permissions")
          permissions = {}
          if isinstance(permissions_in, dict):
              for key in ("can_use_api", "can_create_hotlinks",
                          "profile_can_use_api", "profile_can_create_hotlinks"):
                  value = permissions_in.get(key)
                  permissions[key] = value if type(value) is bool else None

          summary = {
              "schema_version": 1,
              "scanner": "mocha",
              "generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "scan_observed_at": scan.get("scan_observed_at"),
              "catalog_commit": os.environ["CATALOG_COMMIT"],
              "scan_complete": scan.get("scan_complete") is True,
              "authentication": "verified_by_file_listing" if scan.get("authentication") == "verified_by_file_listing" else "not_verified",
              "folder_count": int(os.environ["PUBLIC_FOLDER_COUNT"]) if os.environ.get("PUBLIC_FOLDER_COUNT", "").isdigit() else None,
              "file_count": int(os.environ["PUBLIC_FILE_COUNT"]) if os.environ.get("PUBLIC_FILE_COUNT", "").isdigit() else None,
              "listing_page_count": scan.get("listing_page_count") if type(scan.get("listing_page_count")) is int and scan["listing_page_count"] >= 0 else None,
              "snapshot_consistency": "not_guaranteed_by_api",
              "permissions": permissions,
              "comparison_available": bool(comparison.get("comparison") == "mocha_catalog" and isinstance(counts_in, dict)),
              "counts": counts,
              "possible_duplicate_groups": (
                  len(comparison.get("possible_duplicates", []))
                  if isinstance(comparison.get("possible_duplicates"), list) else None
              ),
              "automatic_cleanup": False,
              "details_published": False,
          }

          compact = json.dumps(summary, separators=(",", ":"), ensure_ascii=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("summary_json=" + compact + "\n")

          lines = [
              "### Mocha scan and catalog comparison",
              "",
              f"- **Scan complete:** {summary['scan_complete']}",
              f"- **Folders:** {summary['folder_count']}",
              f"- **Files:** {summary['file_count']}",
              f"- **Listing pages:** {summary['listing_page_count']}",
              f"- **Catalog commit:** {summary['catalog_commit']}",
              f"- **Possible duplicate groups:** {summary['possible_duplicate_groups']}",
              "- **Automatic cleanup:** disabled",
              "- **Dashboard inventory publication:** pending sanitized inventory validation in the publisher job",
          ]
          for key, value in permissions.items():
              lines.append(f"- **{key.replace('_', ' ').title()}:** {value}")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Display raw Mocha scan and comparison JSON
        if: always()
        env:
          ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reports=(
            "$RUNNER_TEMP/mocha-scan-report.json"
            "$RUNNER_TEMP/mocha-comparison-report.json"
          )
          total_size=0
          for report in "${reports[@]}"; do
            if [ -f "$report" ]; then
              total_size=$((total_size + $(wc -c < "$report")))
            fi
          done

          if [ "$total_size" -le 750000 ]; then
            for report in "${reports[@]}"; do
              if [ -f "$report" ]; then
                echo "## Raw Mocha report: $(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
                echo >> "$GITHUB_STEP_SUMMARY"
                cat "$report" >> "$GITHUB_STEP_SUMMARY"
                echo >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          else
            echo "## Raw Mocha scan reports" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "The combined reports exceed the safe run-summary size. Download both complete JSON files from the `mocha-scan-reports-${{ github.run_id }}-${{ github.run_attempt }}` artifact: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report inventory artifact upload status
        if: always()
        env:
          ARTIFACT_UPLOAD_OUTCOME: ${{ steps.inventory_upload.outcome }}
        run: |
          if [ "$ARTIFACT_UPLOAD_OUTCOME" = "success" ]; then
            echo "- **Sanitized inventory artifact upload:** succeeded (1-day retention; publicly accessible)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Mocha inventory artifact upload failed; catalog comparison and dashboard publication will continue."
            echo "- **Sanitized inventory artifact upload:** FAILED; aggregate summary publication will continue" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-dashboard-summary:
    if: needs.scan.result == 'success' && github.ref == 'refs/heads/main'
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the dashboard reports branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: akirabox-reports
          path: reports-branch
          fetch-depth: 0
      - name: Check out the source commit for publisher helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Download this run's sanitized Mocha inventory
        id: inventory_download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mocha-file-inventory
          path: ${{ runner.temp }}/mocha-inventory

      - name: Download this run's raw Mocha scan reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mocha-scan-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mocha-scan-reports

      - name: Publish only the sanitized Mocha summary
        working-directory: reports-branch
        env:
          SUMMARY_JSON: ${{ needs.scan.outputs.summary_json }}
          INVENTORY_JSON: ${{ runner.temp }}/mocha-inventory/mocha-public-inventory.json
          RAW_REPORT_DIR: ${{ runner.temp }}/mocha-scan-reports
          SOURCE_ROOT: ${{ github.workspace }}/source
          PYTHONPATH: ${{ github.workspace }}/source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch and publish against the latest reports-branch tip. If another
          # workflow advances the branch, retry from that tip without force-pushing.
          for attempt in 1 2 3; do
            if ! git fetch origin akirabox-reports; then
              echo "Could not fetch akirabox-reports on attempt $attempt/3; retrying without reset or push." >&2
              continue
            fi
            git reset --hard FETCH_HEAD
            if ! git fetch origin main; then
              echo "Could not fetch main on attempt $attempt/3; refusing to publish without a current catalog check." >&2
              continue
            fi

            if python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import unicodedata
          from datetime import datetime
          from pathlib import Path

          # Prefer trusted helpers from the workflow commit over files in reports-branch.
          sys.path.insert(0, os.environ["SOURCE_ROOT"])
          from tools.mocha_review_queue import can_silently_clear_match, near_duplicate_file_ids
          from tools.mocha_catalog_candidates import catalog_identity_conflict_file_ids

          summary = json.loads(os.environ["SUMMARY_JSON"])
          allowed = {
              "schema_version", "scanner", "generated_at", "scan_observed_at", "catalog_commit",
              "scan_complete", "authentication", "folder_count", "file_count",
              "listing_page_count", "snapshot_consistency", "permissions",
              "comparison_available", "counts", "possible_duplicate_groups",
              "automatic_cleanup", "details_published",
          }
          if not isinstance(summary, dict) or set(summary) != allowed:
              raise SystemExit("Refusing to publish a summary with an invalid key set.")

          if type(summary["schema_version"]) is not int or summary["schema_version"] != 1:
              raise SystemExit("Refusing to publish an unsupported summary schema.")
          if summary["scanner"] != "mocha":
              raise SystemExit("Refusing to publish a summary from an unknown scanner.")
          def parse_aware_timestamp(value):
              if not isinstance(value, str):
                  raise ValueError("timestamp is missing or is not a string")
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  raise ValueError("timestamp has no timezone")
              return parsed

          try:
              generated_at = parse_aware_timestamp(summary["generated_at"])
              scan_observed_at = parse_aware_timestamp(summary["scan_observed_at"])
          except (KeyError, ValueError) as exc:
              raise SystemExit("Refusing to publish an invalid generation or scan-observation timestamp.") from exc
          if not isinstance(summary["catalog_commit"], str) or not re.fullmatch(r"[0-9a-f]{40}", summary["catalog_commit"]):
              raise SystemExit("Refusing to publish an invalid catalog commit.")
          current_main_commit = subprocess.check_output(
              ["git", "rev-parse", "FETCH_HEAD"], text=True
          ).strip()
          if summary["catalog_commit"] != current_main_commit:
              print("Incoming scan uses an older catalog commit; preserving the current dashboard reports.", file=sys.stderr)
              raise SystemExit(11)
          if type(summary["scan_complete"]) is not bool:
              raise SystemExit("Refusing to publish an invalid scan status.")
          if summary["authentication"] not in {"verified_by_file_listing", "not_verified"}:
              raise SystemExit("Refusing to publish an invalid authentication status.")
          if summary["snapshot_consistency"] != "not_guaranteed_by_api":
              raise SystemExit("Refusing to publish an invalid snapshot consistency value.")

          for key in ("folder_count", "file_count", "listing_page_count", "possible_duplicate_groups"):
              value = summary[key]
              if value is not None and (type(value) is not int or value < 0):
                  raise SystemExit(f"Refusing to publish an invalid {key}.")

          permission_keys = {
              "can_use_api", "can_create_hotlinks",
              "profile_can_use_api", "profile_can_create_hotlinks",
          }
          permissions = summary["permissions"]
          if not isinstance(permissions, dict) or set(permissions) != permission_keys:
              raise SystemExit("Refusing to publish invalid permission fields.")
          if any(value is not None and type(value) is not bool for value in permissions.values()):
              raise SystemExit("Refusing to publish non-boolean permission fields.")

          if type(summary["comparison_available"]) is not bool:
              raise SystemExit("Refusing to publish an invalid comparison status.")
          count_keys = {
              "matched", "metadata_difference", "unverified", "new",
              "ambiguous", "unclassified", "possible_duplicate",
          }
          counts = summary["counts"]
          if not isinstance(counts, dict) or set(counts) != count_keys:
              raise SystemExit("Refusing to publish invalid comparison counts.")
          if any(value is not None and (type(value) is not int or value < 0) for value in counts.values()):
              raise SystemExit("Refusing to publish malformed comparison counts.")
          if summary["automatic_cleanup"] is not False or summary["details_published"] is not False:
              raise SystemExit("Refusing to publish a summary with unsafe flags.")

          target = Path("reports/mocha-scan-summary.json")
          current = None
          try:
              current_bytes = subprocess.check_output(
                  ["git", "show", f"HEAD:{target.as_posix()}"],
                  stderr=subprocess.DEVNULL,
              )
              current = json.loads(current_bytes)
          except (subprocess.CalledProcessError, json.JSONDecodeError, UnicodeDecodeError):
              current = None

          if current is not None:
              current_time_text = current.get("scan_observed_at") if isinstance(current, dict) else None
              try:
                  current_time = parse_aware_timestamp(current_time_text)
              except (AttributeError, KeyError, TypeError, ValueError):
                  print("Warning: existing dashboard summary has no valid scan-observation timestamp; replacing it with the validated incoming summary.", file=__import__("sys").stderr)
                  current = None
              if current is not None and scan_observed_at <= current_time:
                  print("Incoming scan observation is not newer; preserving the current dashboard summary.")
                  raise SystemExit(10)

          inventory = None
          inventory_path = Path(os.environ['INVENTORY_JSON'])
          try:
              candidate = json.loads(inventory_path.read_text(encoding='utf-8'))
              required = {'schema_version','scanner','scan_observed_at','file_count','files'}
              if not isinstance(candidate, dict) or set(candidate) != required: raise ValueError('unexpected inventory schema')
              if candidate['schema_version'] != 1 or candidate['scanner'] != 'mocha': raise ValueError('unsupported inventory schema')
              if candidate['scan_observed_at'] != summary['scan_observed_at']: raise ValueError('scan timestamps differ')
              if type(candidate['file_count']) is not int or candidate['file_count'] != summary['file_count']: raise ValueError('file counts differ')
              if not isinstance(candidate['files'], list) or len(candidate['files']) != candidate['file_count']: raise ValueError('invalid files list')
              keys = {'name','folder_path','size_bytes','created_at','platform','catalog_category','extension'}
              for item in candidate['files']:
                  if not isinstance(item, dict) or set(item) != keys: raise ValueError('invalid inventory entry')
                  if not isinstance(item['name'], str) or not item['name'] or not isinstance(item['folder_path'], str): raise ValueError('invalid name or folder')
                  if item['size_bytes'] is not None and (type(item['size_bytes']) is not int or item['size_bytes'] < 0): raise ValueError('invalid size')
                  for key in ('created_at','platform','catalog_category','extension'):
                      if item[key] is not None and not isinstance(item[key], str): raise ValueError('invalid ' + key)
              inventory = candidate
          except (OSError, json.JSONDecodeError, UnicodeDecodeError, ValueError, KeyError, TypeError) as exc:
              print('Sanitized inventory unavailable; publishing aggregate summary only: ' + str(exc), file=__import__('sys').stderr)
          summary['details_published'] = inventory is not None
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          if inventory is not None:
              inventory_target = Path('reports/mocha-file-inventory.json')
              inventory_target.write_text(json.dumps(inventory, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Publish only entries that genuinely require a human decision.
          # Exact catalog matches are auto-cleared; prior owner rejections stay resolved.
          review_queue = None
          review_state_validated = False
          try:
              raw_dir = Path(os.environ['RAW_REPORT_DIR'])
              raw_scan = json.loads((raw_dir / 'mocha-scan-report.json').read_text(encoding='utf-8'))
              raw_comparison = json.loads((raw_dir / 'mocha-comparison-report.json').read_text(encoding='utf-8'))
              approved_paths = {
                  'ps4/games': ('PS4', 'games'), 'ps4/dlc': ('PS4', 'dlc'),
                  'ps5/games': ('PS5', 'games'), 'ps5/dlc': ('PS5', 'dlc'),
              }
              if (raw_scan.get('scanner') != 'mocha' or raw_scan.get('scan_complete') is not True
                      or raw_comparison.get('comparison') != 'mocha_catalog'
                      or raw_comparison.get('catalog_commit') != summary['catalog_commit']
                      or raw_scan.get('scan_observed_at') != summary['scan_observed_at']):
                  raise ValueError('raw scan/comparison snapshot does not match the published summary')

              # Rejection records are already sanitized on akirabox-reports.
              # Require the source file and validate it; never silently forget prior decisions.
              rejection_path = Path('reports/akirabox-rejections.json')
              rejection_report = json.loads(rejection_path.read_text(encoding='utf-8'))
              if (not isinstance(rejection_report, dict) or rejection_report.get('schema_version') != 1
                      or not isinstance(rejection_report.get('records'), list)):
                  raise ValueError('saved rejection report has an unsupported format')

              def normalize_rejection_name(value):
                  if not isinstance(value, str) or not value.strip():
                      raise ValueError('rejection record has no valid filename')
                  normalized = unicodedata.normalize('NFKC', value).strip().casefold()
                  return normalized[:-4] if normalized.endswith('.pkg') else normalized

              rejected = {}
              for record in rejection_report['records']:
                  if not isinstance(record, dict):
                      raise ValueError('saved rejection report contains a malformed record')
                  if record.get('status') != 'manual_deletion_required':
                      continue
                  platform = record.get('platform')
                  category = record.get('catalog_category')
                  if platform not in {'PS4', 'PS5'} or category not in {'games', 'dlc'}:
                      raise ValueError('saved rejection record has an invalid platform/category')
                  try:
                      rejected_at = datetime.fromisoformat(
                          record['rejected_at'].replace('Z', '+00:00')
                      )
                  except (KeyError, AttributeError, TypeError, ValueError) as exc:
                      raise ValueError('saved rejection record has an invalid rejection timestamp') from exc
                  if rejected_at.tzinfo is None:
                      raise ValueError('saved rejection timestamp has no timezone')
                  key = (platform, category, normalize_rejection_name(record.get('name')))
                  rejected.setdefault(key, []).append(rejected_at)

              # Prior owner decisions are durable and scoped to one exact upload.
              decisions_path = Path('reports/mocha-review-decisions.json')
              if decisions_path.exists():
                  decisions_report = json.loads(decisions_path.read_text(encoding='utf-8'))
              else:
                  decisions_report = {'schema_version': 1, 'records': []}
              if (not isinstance(decisions_report, dict) or decisions_report.get('schema_version') != 1
                      or not isinstance(decisions_report.get('records'), list)):
                  raise ValueError('saved Mocha review decisions have an unsupported format')
              resolved_decisions = set()
              for decision in decisions_report['records']:
                  if not isinstance(decision, dict) or decision.get('status') != 'resolved':
                      raise ValueError('saved Mocha review decision is malformed')
                  decision_key = decision.get('decision_key')
                  if not isinstance(decision_key, str) or not re.fullmatch(r'[0-9a-f]{64}', decision_key):
                      raise ValueError('saved Mocha review decision has an invalid identity key')
                  if decision.get('action') not in {'keep', 'reject', 'resolve'}:
                      raise ValueError('saved Mocha review decision has an invalid action')
                  resolved_decisions.add(decision_key)

              def stable_decision_key(platform, category, name, created_text):
                  if not all(isinstance(value, str) and value.strip() for value in
                             (platform, category, name, created_text)):
                      return None
                  try:
                      uploaded = datetime.fromisoformat(created_text.replace('Z', '+00:00'))
                  except ValueError:
                      return None
                  if uploaded.tzinfo is None:
                      return None
                  identity = chr(0).join((
                      platform, category,
                      unicodedata.normalize('NFKC', name).strip().casefold(),
                      uploaded.astimezone(__import__('datetime').timezone.utc).isoformat(),
                  ))
                  return hashlib.sha256(identity.encode('utf-8')).hexdigest()

              allowed_ids = set()
              scan_files_by_id = {}
              for item in raw_scan.get('files', []):
                  if not isinstance(item, dict):
                      raise ValueError('malformed scan file')
                  folder = item.get('folder_path')
                  classification = approved_paths.get(folder.strip('/').casefold()) if isinstance(folder, str) else None
                  if classification and (item.get('platform'), item.get('catalog_category')) == classification:
                      if item.get('id') is not None:
                          file_id = str(item['id'])
                          allowed_ids.add(file_id)
                          scan_files_by_id[file_id] = item

              comparison_rows = raw_comparison.get('results')
              if not isinstance(comparison_rows, list):
                  raise ValueError('comparison results are missing')
              expected_ids = {
                  str(item['id']) for item in raw_scan.get('files', [])
                  if isinstance(item, dict) and item.get('id') is not None
                  and item.get('extension') == 'pkg'
                  and isinstance(item.get('folder_path'), str)
                  and approved_paths.get(item['folder_path'].strip('/').casefold()) ==
                      (item.get('platform'), item.get('catalog_category'))
              }
              result_ids = {
                  str(row['file_id']) for row in comparison_rows
                  if isinstance(row, dict) and row.get('file_id') is not None
                  and str(row['file_id']) in allowed_ids
              }
              if result_ids != expected_ids:
                  raise ValueError('comparison does not cover every approved package file')

              duplicate_ids = set()
              for group in raw_comparison.get('possible_duplicates', []):
                  if not isinstance(group, dict) or not isinstance(group.get('file_ids'), list):
                      raise ValueError('malformed possible-duplicate group')
                  group_ids = {str(value) for value in group['file_ids']}
                  if not group_ids.issubset(allowed_ids):
                      raise ValueError('duplicate group contains an out-of-scope file')
                  duplicate_ids.update(group_ids)

              # Detect matched uploads that share core identity even when optional
              # filename tags (languages/minimum firmware) differ or are missing.
              # Keep all members of such groups visible for human review.
              duplicate_ids.update(near_duplicate_file_ids(raw_comparison.get('results', [])))
              duplicate_ids.update(catalog_identity_conflict_file_ids(
                  raw_comparison.get('results', []), Path(os.environ['SOURCE_ROOT'])
              ))

              entries = []
              # Legacy counter name is retained for dashboard schema compatibility.
              # This counts queue-cleared metadata matches, not binary-integrity approval.
              automatically_cleared = 0
              previously_rejected = 0
              previously_decided = 0
              source_fields = ('title', 'title_id', 'region', 'languages', 'version', 'min_fw', 'size_bytes')
              catalog_fields = ('name', 'title_id', 'region', 'languages', 'version', 'min_fw', 'size')
              for row in raw_comparison.get('results', []):
                  if not isinstance(row, dict) or row.get('file_id') is None or str(row['file_id']) not in allowed_ids:
                      continue
                  status = row.get('status')
                  if status not in {'matched', 'metadata_difference', 'unverified', 'new', 'ambiguous', 'unclassified'}:
                      raise ValueError('unknown comparison status')
                  file_id = str(row['file_id'])
                  scan_item = scan_files_by_id[file_id]
                  is_duplicate = file_id in duplicate_ids

                  # Suppress only the same exact filename in the same category when
                  # Mocha's upload timestamp proves it predates the recorded rejection.
                  # A later re-upload with the same filename remains eligible for review.
                  rejection_key = (
                      row.get('platform'), row.get('category'),
                      normalize_rejection_name(row.get('name')),
                  )
                  matching_rejections = rejected.get(rejection_key, [])
                  created_text = scan_item.get('created_at')
                  if matching_rejections and isinstance(created_text, str):
                      try:
                          created_at = datetime.fromisoformat(created_text.replace('Z', '+00:00'))
                      except ValueError:
                          created_at = None
                      if created_at is not None and created_at.tzinfo is not None and any(
                              created_at <= rejected_at for rejected_at in matching_rejections):
                          previously_rejected += 1
                          continue

                  decision_key = stable_decision_key(
                      row.get('platform'), row.get('category'), row.get('name'), created_text
                  )
                  if decision_key is not None and decision_key in resolved_decisions:
                      previously_decided += 1
                      continue

                  binary_verified = row.get('binary_integrity_verified')
                  if type(binary_verified) is not bool:
                      raise ValueError('comparison row has no valid binary-integrity verification state')

                  # Clear unique metadata matches independently of binary verification.
                  # Snapshot consistency is not exposed by Mocha's API.
                  try:
                      uploaded_at = datetime.fromisoformat(created_text.replace('Z', '+00:00')) if isinstance(created_text, str) else None
                  except ValueError:
                      uploaded_at = None
                  identity_complete = (
                      isinstance(file_id, str)
                      and re.fullmatch(r'[A-Za-z0-9._-]{1,128}', file_id) is not None
                      and uploaded_at is not None
                      and uploaded_at.tzinfo is not None
                  )
                  if can_silently_clear_match(
                          status, is_duplicate, binary_verified, identity_complete=identity_complete):
                      automatically_cleared += 1
                      continue
                  source_meta = row.get('source_metadata') if isinstance(row.get('source_metadata'), dict) else {}
                  catalog_meta = row.get('catalog_metadata') if isinstance(row.get('catalog_metadata'), dict) else {}
                  entries.append({
                      'name': row.get('name') if isinstance(row.get('name'), str) else 'Unnamed file',
                      'created_at': created_text if isinstance(created_text, str) else '',
                      'decision_key': decision_key or '',
                      'folder_path': row.get('folder_path') if isinstance(row.get('folder_path'), str) else '',
                      'platform': row.get('platform') if isinstance(row.get('platform'), str) else '',
                      'category': row.get('category') if isinstance(row.get('category'), str) else '',
                      'status': 'possible_duplicate' if is_duplicate else status,
                      'binary_integrity_verified': binary_verified,
                      'reason': row.get('reason') if isinstance(row.get('reason'), str) else 'Manual verification required',
                      'metadata_differences': row.get('metadata_differences') if isinstance(row.get('metadata_differences'), list) else [],
                      'unavailable_metadata': row.get('unavailable_metadata') if isinstance(row.get('unavailable_metadata'), list) else [],
                      'source_metadata': {key: source_meta[key] for key in source_fields if key in source_meta},
                      'catalog_metadata': {key: catalog_meta[key] for key in catalog_fields if key in catalog_meta},
                  })
              review_queue = {
                  'schema_version': 1, 'scanner': 'mocha',
                  'scan_observed_at': summary['scan_observed_at'],
                  'catalog_commit': summary['catalog_commit'],
                  'auto_approved_count': automatically_cleared,
                  'previously_rejected_count': previously_rejected,
                  'previously_decided_count': previously_decided,
                  'pending_count': len(entries),
                  'entries': entries,
              }
              Path('reports/mocha-review-queue.json').write_text(
                  json.dumps(review_queue, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
              )
              review_state_validated = True
          except (OSError, json.JSONDecodeError, UnicodeDecodeError, ValueError, KeyError, TypeError) as exc:
              print('Human-review queue unavailable; refusing to publish a partial queue: ' + str(exc), file=__import__('sys').stderr)
              review_queue = None

          # Remove the previous snapshot first. A failed generation must never
          # leave a stale approval queue available on the reports branch.
          Path('reports/mocha-catalog-candidates.json').unlink(missing_ok=True)

          # Generate separate source-registration candidates before exact matches
          # disappear from the human-review queue. This remains read-only.
          try:
              from tools.mocha_catalog_candidates import build_candidate_queue
              raw_dir = Path(os.environ['RAW_REPORT_DIR'])
              raw_scan = json.loads((raw_dir / 'mocha-scan-report.json').read_text(encoding='utf-8'))
              raw_comparison = json.loads((raw_dir / 'mocha-comparison-report.json').read_text(encoding='utf-8'))
              if (raw_scan.get('scan_observed_at') != summary['scan_observed_at']
                      or raw_comparison.get('catalog_commit') != summary['catalog_commit']):
                  raise ValueError('candidate inputs do not match the published scan/catalog snapshot')
              if (not review_state_validated or not isinstance(rejected, dict)
                      or not isinstance(resolved_decisions, set)
                      or not callable(stable_decision_key) or not callable(normalize_rejection_name)):
                  raise ValueError('saved review decisions are unavailable; refusing candidate publication')
              excluded_candidate_ids = set()
              for row in raw_comparison.get('results', []):
                  if not isinstance(row, dict) or row.get('status') != 'matched' or row.get('file_id') is None:
                      continue
                  file_id = str(row['file_id'])
                  scan_item = scan_files_by_id.get(file_id)
                  if scan_item is None:
                      raise ValueError('matched candidate is absent from the validated scan inventory')
                  created_text = scan_item.get('created_at')
                  rejection_key = (
                      row.get('platform'), row.get('category'),
                      normalize_rejection_name(row.get('name')),
                  )
                  matching_rejections = rejected.get(rejection_key, [])
                  if matching_rejections and isinstance(created_text, str):
                      try:
                          created_at = datetime.fromisoformat(created_text.replace('Z', '+00:00'))
                      except ValueError:
                          created_at = None
                      if created_at is not None and created_at.tzinfo is not None and any(
                              created_at <= rejected_at for rejected_at in matching_rejections):
                          excluded_candidate_ids.add(file_id)
                          continue
                  decision_key = stable_decision_key(
                      row.get('platform'), row.get('category'), row.get('name'), created_text
                  )
                  if decision_key is not None and decision_key in resolved_decisions:
                      excluded_candidate_ids.add(file_id)
              candidate_queue = build_candidate_queue(
                  raw_scan, raw_comparison, Path(os.environ['SOURCE_ROOT']), excluded_candidate_ids
              )
              if len(json.dumps(candidate_queue, ensure_ascii=False).encode('utf-8')) > 5000000:
                  raise ValueError('candidate queue exceeds the 5 MB publication limit')
              Path('reports/mocha-catalog-candidates.json').write_text(
                  json.dumps(candidate_queue, indent=2, ensure_ascii=False) + chr(10), encoding='utf-8'
              )
          except (OSError, json.JSONDecodeError, UnicodeDecodeError, ValueError, KeyError, TypeError) as exc:
              print('Catalog candidate queue unavailable; refusing to publish a partial queue: ' + str(exc), file=__import__('sys').stderr)

          print('Inventory publication: ' + ('published' if inventory is not None else 'unavailable; old inventory will be hidden by dashboard timestamp validation'))
          print('Human-review queue: ' + ('published' if review_queue is not None else 'unavailable; dashboard must not treat it as empty'))
          PY
            then
              :
            else
              validation_status=$?
              if [ "$validation_status" -eq 10 ] || [ "$validation_status" -eq 11 ]; then
                exit 0
              fi
              exit "$validation_status"
            fi

            git add reports/mocha-scan-summary.json
            for report in mocha-scan-report.json mocha-comparison-report.json; do
              source="$RAW_REPORT_DIR/$report"
              if [ -f "$source" ] && [ "$(wc -c < "$source")" -le 5000000 ]; then
                cp "$source" "reports/$report"
                git add "reports/$report"
              else
                echo "Keeping $report in the run artifact only (missing or larger than 5 MB)."
              fi
            done
            if [ -f reports/mocha-file-inventory.json ]; then git add reports/mocha-file-inventory.json; fi
            if [ -f reports/mocha-review-queue.json ]; then git add reports/mocha-review-queue.json; fi
            if [ -f reports/mocha-catalog-candidates.json ]; then
              git add reports/mocha-catalog-candidates.json
            elif git ls-files --error-unmatch reports/mocha-catalog-candidates.json >/dev/null 2>&1; then
              git add -u -- reports/mocha-catalog-candidates.json
            fi
            if git diff --cached --quiet; then
              echo "Mocha dashboard summary is already current."
              exit 0
            fi

            git commit -m "Publish sanitized Mocha scan summary"
            if ! git fetch origin main; then
              echo "Could not recheck main immediately before publication; refusing to push." >&2
              continue
            fi
            expected_catalog_commit="$(python -c 'import json,os; print(json.loads(os.environ["SUMMARY_JSON"])["catalog_commit"])')"
            if [ "$(git rev-parse FETCH_HEAD)" != "$expected_catalog_commit" ]; then
              echo "main advanced after validation; refusing to publish a report based on an older catalog commit."
              exit 0
            fi
            if git push origin HEAD:akirabox-reports; then
              exit 0
            fi

            echo "Reports branch advanced or push failed; retrying from its latest tip (attempt $attempt/3)." >&2
          done

          echo "Could not publish the Mocha summary after 3 bounded attempts." >&2
          exit 1

  auto-register-safe-replacements:
    if: needs.publish-dashboard-summary.result == 'success' && github.ref == 'refs/heads/main'
    needs: publish-dashboard-summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the exact catalog commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out the matching reports snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: akirabox-reports
          path: reports-branch
          fetch-depth: 1

      - name: Download this run's raw Mocha scan reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mocha-scan-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mocha-raw

      - name: Prepare validated candidate inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mocha-auto"
          cp reports-branch/reports/mocha-catalog-candidates.json "$RUNNER_TEMP/mocha-auto/candidates.json"
          cp reports-branch/reports/mocha-scan-summary.json "$RUNNER_TEMP/mocha-auto/summary.json"
          cp reports-branch/reports/akirabox-rejections.json "$RUNNER_TEMP/mocha-auto/rejections.json"
          if [ -f reports-branch/reports/mocha-review-decisions.json ]; then
            cp reports-branch/reports/mocha-review-decisions.json "$RUNNER_TEMP/mocha-auto/decisions.json"
          else
            printf '%s\n' '{"schema_version":1,"records":[]}' > "$RUNNER_TEMP/mocha-auto/decisions.json"
          fi

      - name: Apply only exact, unique, undecided replacements
        id: apply
        env:
          CANDIDATE_REPORT: ${{ runner.temp }}/mocha-auto/candidates.json
          SUMMARY: ${{ runner.temp }}/mocha-auto/summary.json
          DECISIONS: ${{ runner.temp }}/mocha-auto/decisions.json
          REJECTIONS: ${{ runner.temp }}/mocha-auto/rejections.json
          SCAN_REPORT: ${{ runner.temp }}/mocha-raw/mocha-scan-report.json
          COMPARISON_REPORT: ${{ runner.temp }}/mocha-raw/mocha-comparison-report.json
          RESULT: ${{ runner.temp }}/mocha-auto/result.json
        run: |
          set -euo pipefail
          python -m tools.auto_apply_mocha_candidates \
            --candidate-report "$CANDIDATE_REPORT" \
            --summary "$SUMMARY" \
            --scan-report "$SCAN_REPORT" \
            --comparison-report "$COMPARISON_REPORT" \
            --decisions "$DECISIONS" \
            --rejections "$REJECTIONS" \
            --repo-root . \
            --current-commit "$GITHUB_SHA" > "$RUNNER_TEMP/mocha-auto/result.json"
          count="$(python -c 'import json,os; print(json.load(open(os.environ["RESULT"]))["applied_count"])')"
          echo "applied_count=$count" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/mocha-auto/result.json"

      - name: Stop when no safe replacements are available
        if: steps.apply.outputs.applied_count == '0'
        run: echo "No safe Mocha replacements to register."

      - name: Validate repository tests and catalog schemas
        if: steps.apply.outputs.applied_count != '0'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt "pytest==8.4.2"
          python -m pytest -q
          python tools/validate_catalogs.py
          python tools/duplicate_check.py

      - name: Create and automatically merge the catalog pull request
        if: steps.apply.outputs.applied_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="mocha-auto-replacements-${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // empty')"
            if [ -z "$existing_pr" ]; then
              echo "Automatic catalog branch exists without an open PR; refusing to overwrite it." >&2
              exit 1
            fi
            gh pr merge "$existing_pr" --squash --delete-branch
            exit 0
          fi
          git switch --create "$branch"
          git add ps4/games.json ps4/dlc.json ps5/ps5-games.json ps5/ps5-dlc.json
          if git diff --cached --quiet; then
            echo "No catalog changes remain after validation."
            exit 0
          fi
          git commit -m "Automatically register safe Mocha catalog sources"
          git push origin "$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Automatically register safe Mocha sources" \
            --body "Automated registration of exact, unique Mocha metadata matches. The workflow validated the current scan/catalog snapshot, saved decisions and rejections, ran the repository test suite, and validated all catalog schemas. No ambiguous or conflicting candidates are included. Binary integrity is not verified.")"
          echo "Created $pr_url"
          gh pr merge "$pr_url" --squash --delete-branch

  auto-repair-verified-pkg-metadata:
    if: needs['auto-register-safe-replacements'].result == 'success' && github.ref == 'refs/heads/main'
    needs: auto-register-safe-replacements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out the latest main catalog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install repair dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest==8.4.2"

      - name: Download this scan's validated Mocha inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mocha-scan-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mocha-scan-reports

      - name: Apply only identity-verified PKG metadata repairs
        id: repair
        env:
          MOCHA_API_KEY: ${{ secrets.MOCHA_API_KEY }}
          SCAN_REPORT: ${{ runner.temp }}/mocha-scan-reports/mocha-scan-report.json
          REPAIR_REPORT: ${{ runner.temp }}/pkg-metadata-repair-report.json
        run: |
          set -euo pipefail
          python tools/pkg_metadata_repair.py \
            --scan-report "$SCAN_REPORT" \
            --catalog-root . \
            --apply \
            --output "$REPAIR_REPORT"
          python - <<'PY'
          import json
          import os
          with open(os.environ["REPAIR_REPORT"], encoding="utf-8") as stream:
              report = json.load(stream)
          if report.get("scanner") != "pkg-metadata-repair":
              raise SystemExit("Unexpected PKG metadata repair report")
          applied = report.get("applied_count")
          proposed = report.get("proposed_count")
          if type(applied) is not int or applied < 0 or type(proposed) is not int or proposed < applied:
              raise SystemExit("Invalid PKG metadata repair counts")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"applied_count={applied}\n")
              output.write(f"proposed_count={proposed}\n")
          print(json.dumps({
              "targets_found": report.get("targets_found"),
              "proposed_count": proposed,
              "applied_count": applied,
              "catalog_files_modified": report.get("catalog_files_modified"),
              "results": [
                  {
                      "catalog": row.get("catalog"),
                      "source": row.get("source"),
                      "status": row.get("status"),
                      "reason": row.get("reason"),
                      "proposed_updates": row.get("proposed_updates"),
                  }
                  for row in report.get("results", [])
              ],
          }, indent=2))
          PY

      - name: Upload PKG metadata repair report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pkg-metadata-repair-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkg-metadata-repair-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Stop when no verified metadata updates exist
        if: steps.repair.outputs.applied_count == '0'
        run: echo "No identity-verified PKG metadata updates were safe to apply."

      - name: Validate tests and catalog schemas
        if: steps.repair.outputs.applied_count != '0'
        run: |
          set -euo pipefail
          python -m pytest -q
          python tools/validate_catalogs.py

      - name: Create and automatically merge the verified metadata repair PR
        if: steps.repair.outputs.applied_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="pkg-metadata-repair-${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // empty')"
            if [ -z "$existing_pr" ]; then
              echo "Automatic metadata repair branch exists without an open PR; refusing to overwrite it." >&2
              exit 1
            fi
            gh pr merge "$existing_pr" --squash --delete-branch
            exit 0
          fi
          git switch --create "$branch"
          git add ps4/dlc.json ps5/ps5-apps.json
          if git diff --cached --quiet; then
            echo "No catalog changes remain after validation."
            exit 0
          fi
          git commit -m "Automatically repair verified PKG metadata"
          git push origin "$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Automatically repair verified PKG metadata" \
            --body "Automated PKG metadata repair. Only missing fields extracted from real PKG PARAM.SFO were applied after exact title_id and byte-size checks. Ambiguous Mocha filename matches, inaccessible sources, unsupported PS5 packages, identity mismatches, and unverifiable region values were not changed. The workflow ran the repository tests and catalog schema validation. Binary integrity is not verified.")"
          echo "Created $pr_url"
          gh pr merge "$pr_url" --squash --delete-branch

