name: Mocha Scan and Duplicate Review (Read-Only)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# Keep each scan independent; do not replace an already queued run.
concurrency:
  group: mocha-catalog-scan-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest==8.4.2"

      - name: Run repository tests
        run: python -m pytest -q

      - name: Scan Mocha folders and file metadata
        env:
          MOCHA_API_KEY: ${{ secrets.MOCHA_API_KEY }}
        run: python tools/mocha_scanner.py --output "$RUNNER_TEMP/mocha-scan-report.json"

      - name: Compare Mocha metadata with current catalogs
        run: |
          python tools/mocha_catalog_compare.py \
            --scan-report "$RUNNER_TEMP/mocha-scan-report.json" \
            --catalog-root . \
            --output "$RUNNER_TEMP/mocha-comparison-report.json"

      - name: Publish aggregate scan summary
        if: always()
        env:
          SCAN_REPORT: ${{ runner.temp }}/mocha-scan-report.json
          COMPARISON_REPORT: ${{ runner.temp }}/mocha-comparison-report.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["### Mocha scan and catalog comparison", ""]

          scan_path = Path(os.environ["SCAN_REPORT"])
          if scan_path.is_file():
              try:
                  scan = json.loads(scan_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  scan = {}
              lines.extend([
                  f"- **Authentication:** {scan.get('authentication', 'not verified')}",
                  f"- **Folders:** {scan.get('folder_count', 'not available')}",
                  f"- **Files:** {scan.get('file_count', 'not available')}",
                  f"- **Listing pages:** {scan.get('listing_page_count', 'not available')}",
                  f"- **Scan complete:** {scan.get('scan_complete', False)}",
                  f"- **Snapshot consistency:** {scan.get('snapshot_consistency', 'unknown')}",
              ])
              permissions = scan.get("permissions") or {}
              if isinstance(permissions, dict):
                  lines.append(f"- **API access:** {permissions.get('can_use_api', 'unknown')}")
                  lines.append(f"- **Hotlink creation:** {permissions.get('can_create_hotlinks', 'unknown')}")
              if scan.get("error"):
                  lines.append(f"- **Scan error:** {scan['error']}")
          else:
              lines.append("- **Scan report:** not produced")

          comparison_path = Path(os.environ["COMPARISON_REPORT"])
          if comparison_path.is_file():
              try:
                  comparison = json.loads(comparison_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  comparison = {}
              counts = comparison.get("counts")
              if isinstance(counts, dict):
                  lines.extend(["", "**Catalog comparison**"])
                  for key, value in counts.items():
                      lines.append(f"- {key.replace('_', ' ').title()}: {value}")
                  lines.append(
                      f"- Possible duplicate groups: {len(comparison.get('possible_duplicates', []))}"
                  )
                  lines.append("- Automatic cleanup: disabled; Mocha SHA-256 is unavailable")
              else:
                  lines.extend(["", "- **Catalog comparison:** unavailable"])
          else:
              lines.extend(["", "- **Catalog comparison:** not run"])

          lines.extend([
              "",
              "File names, file IDs, folder paths, API responses, and credentials are not included in this summary.",
              "No Mocha files or catalog entries are modified by this workflow.",
          ])
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
