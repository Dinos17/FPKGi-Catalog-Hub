name: Temporary Release Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          releases_json="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/releases?per_page=100")"

          count="$(printf '%s' "$releases_json" | jq 'length')"
          echo "Releases found: $count"

          if [ "$count" -gt 0 ]; then
            printf '%s' "$releases_json" |
              jq -r '.[].id' |
              while read -r release_id; do
                echo "Deleting release ID $release_id"
                curl -fsSL -X DELETE                   -H "Accept: application/vnd.github+json"                   -H "Authorization: Bearer $GH_TOKEN"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "https://api.github.com/repos/$REPO/releases/$release_id"
              done
          fi

          remaining="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/releases?per_page=100" |
            jq 'length')"

          echo "Releases remaining: $remaining"

          if [ "$remaining" -ne 0 ]; then
            echo "Release cleanup failed."
            exit 1
          fi

      - name: Remove temporary workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          file=" .github/workflows/temporary-release-cleanup.yml"
          file="${file# }"

          sha="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/contents/$file" |
            jq -r '.sha')"

          curl -fsSL -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -d "$(jq -n --arg message "Remove temporary release cleanup workflow" --arg sha "$sha" '{message:$message,sha:$sha}')"             "https://api.github.com/repos/$REPO/contents/$file"
