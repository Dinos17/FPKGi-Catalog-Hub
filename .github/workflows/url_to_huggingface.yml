name: Upload URL to Hugging Face

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct URL of a file you are authorized to upload"
        required: true
        type: string
      hf_repo:
        description: "Optional Hugging Face repository override"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source file
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          echo "Downloading source file..."
          curl_error="$(mktemp)"

          if ! curl --silent --show-error --fail --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --remote-header-name --remote-name "$SOURCE_URL" 2>"$curl_error"; then
            echo "Download failed after all retries:"
            cat "$curl_error"
            rm -f "$curl_error"
            exit 1
          fi

          rm -f "$curl_error"

          source_file="$(find . -maxdepth 1 -type f -printf '%f\n' | head -n 1)"
          if [ -z "$source_file" ]; then
            echo "Could not determine the downloaded filename."
            exit 1
          fi

          test -s "$source_file"
          echo "SOURCE_FILE=$source_file" >> "$GITHUB_ENV"
          echo "Downloaded: $source_file"
          ls -lh "$source_file"

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo }}
        run: |
          set -euo pipefail

          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN repository secret is not configured."
            exit 1
          fi

          python -m pip install --disable-pip-version-check huggingface_hub

          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ.get("HF_REPO", "").strip()
          source_file = Path(os.environ["SOURCE_FILE"])
          path_in_repo = source_file.name

          HfApi(token=token).upload_file(
              path_or_fileobj=str(source_file),
              path_in_repo=path_in_repo,
              repo_id=repo_id,
              repo_type="dataset",
              commit_message=f"Upload {path_in_repo}",
          )

          print(f"Uploaded {path_in_repo} to {repo_id}")
          PY
