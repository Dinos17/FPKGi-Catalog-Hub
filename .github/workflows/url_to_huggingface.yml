name: Upload URL to Hugging Face

on:
  workflow_dispatch:
    inputs:
      source_collection:
        description: "Archive.org collection to process"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ps4-fpkg-collection-english-t
          - ps4-fpkg-collection-english-d
      hf_repo:
        description: "Optional Hugging Face repository override"
        required: false
        default: ""
        type: string
      hf_path:
        description: "Optional exact destination path inside the Hugging Face dataset (single-file mode only)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04

    steps:
      - name: Inspect and stream source to Hugging Face
        env:
          SOURCE_COLLECTION: ${{ inputs.source_collection }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo }}
          HF_PATH: ${{ inputs.hf_path }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check huggingface_hub requests

          python - <<'PY'
          import io
          import os
          import re
          import struct
          from urllib.parse import unquote, urlparse

          import requests
          from huggingface_hub import CommitOperationAdd, HfApi

          source_collection = os.environ["SOURCE_COLLECTION"]
          token = os.environ["HF_TOKEN"]
          repo_id = os.environ.get("HF_REPO", "").strip()
          requested_path = os.environ.get("HF_PATH", "").strip()

          if not token:
              raise SystemExit("HF_TOKEN repository secret is not configured.")
          collections = {
              "ps4-fpkg-collection-english-t": "ps4-fpkg-collection-english-t",
              "ps4-fpkg-collection-english-d": "ps4-fpkg-collection-english-d",
          }
          if source_collection == "both":
              identifiers = list(collections.values())
          elif source_collection in collections:
              identifiers = [collections[source_collection]]
          else:
              raise SystemExit(f"Unknown Archive.org collection: {source_collection}")

          session = requests.Session()
          session.headers.update({"User-Agent": "FPKGi-Catalog-Hub/1.0"})

          def archive_pkg_urls(identifier):
              metadata_url = f"https://archive.org/metadata/{identifier}"
              response = session.get(metadata_url, timeout=60)
              response.raise_for_status()
              files = response.json().get("files", [])
              urls = []
              for record in files:
                  name = str(record.get("name") or "")
                  if name.lower().endswith(".pkg"):
                      urls.append(
                          "https://archive.org/download/"
                          f"{identifier}/{name}"
                      )
              return urls

          source_urls = []
          seen_urls = set()
          for identifier in identifiers:
              urls = archive_pkg_urls(identifier)
              print(f"{identifier}: found {len(urls)} PKG files")
              for url in urls:
                  if url not in seen_urls:
                      seen_urls.add(url)
                      source_urls.append(url)

          print(f"Total unique Archive.org PKG URLs: {len(source_urls)}")

          class RemoteRangeFile(io.BufferedIOBase):
              """Seekable file-like object backed entirely by HTTP ranges."""

              def __init__(self, url, size):
                  self.url = url
                  self.size = size
                  self.pos = 0
                  self.session = requests.Session()
                  self.session.headers.update(
                      {"User-Agent": "FPKGi-Catalog-Hub/1.0"}
                  )

              def readable(self):
                  return True

              def seekable(self):
                  return True

              def tell(self):
                  return self.pos

              def seek(self, offset, whence=0):
                  if whence == 0:
                      new_pos = offset
                  elif whence == 1:
                      new_pos = self.pos + offset
                  elif whence == 2:
                      new_pos = self.size + offset
                  else:
                      raise ValueError("invalid whence")
                  if new_pos < 0 or new_pos > self.size:
                      raise ValueError("seek outside remote file")
                  self.pos = new_pos
                  return self.pos

              def read(self, length=-1):
                  if length is None or length < 0:
                      length = self.size - self.pos
                  if length == 0 or self.pos >= self.size:
                      return b""

                  end = min(self.pos + length, self.size) - 1
                  response = self.session.get(
                      self.url,
                      headers={"Range": f"bytes={self.pos}-{end}"},
                      timeout=180,
                  )
                  response.raise_for_status()

                  content_range = response.headers.get("Content-Range", "")
                  expected = end - self.pos + 1
                  expected_range = f"bytes {self.pos}-{end}/{self.size}"
                  if response.status_code != 206 or content_range != expected_range:
                      raise RuntimeError(
                          f"Range request was not honored: "
                          f"status={response.status_code}, "
                          f"Content-Range={content_range!r}, "
                          f"expected={expected_range!r}"
                      )

                  data = response.content
                  if len(data) != expected:
                      raise RuntimeError(
                          f"Range read mismatch: expected {expected}, got {len(data)}"
                      )
                  self.pos += len(data)
                  return data

          for source_url in source_urls:
              print("\n" + "=" * 80)
              print(f"Processing: {source_url}")

              probe = session.get(
                  source_url,
                  allow_redirects=True,
                  timeout=60,
                  headers={"Range": "bytes=0-0"},
              )
              probe.raise_for_status()
              final_url = probe.url
              content_range = probe.headers.get("Content-Range", "")
              match = re.fullmatch(r"bytes 0-0/(\d+)", content_range)
              if not match:
                  print(f"SKIP: invalid Content-Range: {content_range!r}")
                  continue

              size = int(match.group(1))
              filename = unquote(os.path.basename(urlparse(final_url).path))
              if not filename or size <= 0:
                  print("SKIP: could not determine remote filename or size.")
                  continue

              print(f"Remote file: {filename}")
              print(f"Remote size: {size:,} bytes")

              remote = RemoteRangeFile(final_url, size)

              def read_at(offset, length):
                  remote.seek(offset)
                  return remote.read(length)

          # PS4 PKG magic: 0x7F504B47.
              if read_at(0, 4) != bytes.fromhex("7F504B47"):
                  print("SKIP: source is not a valid PS4 PKG.")
                  continue

          header = read_at(0, 0x1000)
          entry_count = struct.unpack_from(">I", header, 0x10)[0]
          table_offset = struct.unpack_from(">I", header, 0x18)[0]

              if entry_count <= 0 or table_offset >= size:
                  print("SKIP: invalid PKG file table.")
                  continue

          table_size = entry_count * 0x20
          table = read_at(table_offset, table_size)

          PARAM_SFO_ID = 0x1000
          sfo_offset = None
          sfo_size = None

          for index in range(entry_count):
              entry = table[index * 0x20:(index + 1) * 0x20]
              entry_id, _, _, _, offset, entry_size = struct.unpack_from(
                  ">IIIIII", entry, 0
              )
              if entry_id == PARAM_SFO_ID:
                  sfo_offset = offset
                  sfo_size = entry_size
                  break

              if sfo_offset is None or sfo_size is None:
                  print("SKIP: PKG does not contain PARAM.SFO.")
                  continue

          sfo = read_at(sfo_offset, sfo_size)

          def parse_sfo(data):
              magic, _, key_offset, data_offset, count = struct.unpack_from(
                  "<5I", data, 0
              )
              if magic != 0x46535000:
                  raise SystemExit("Invalid PARAM.SFO.")

              result = {}
              for index in range(count):
                  offset = 20 + index * 16
                  key_index, fmt, value_len, _, value_offset = struct.unpack_from(
                      "<HHIII", data, offset
                  )
                  key_start = key_offset + key_index
                  key_end = data.find(b"\x00", key_start)
                  key = data[key_start:key_end].decode("utf-8", errors="replace")
                  raw = data[
                      data_offset + value_offset:
                      data_offset + value_offset + value_len
                  ]
                  if fmt & 0xFF == 0x04 and len(raw) >= 4:
                      result[key] = int.from_bytes(raw[:4], "little")
                  else:
                      result[key] = raw.rstrip(b"\x00").decode(
                          "utf-8", errors="replace"
                      )
              return result

          params = parse_sfo(sfo)
          title_id = str(params.get("TITLE_ID") or "").strip().upper()
          title = str(params.get("TITLE") or filename).strip()
          pkg_category = str(params.get("CATEGORY") or "").strip().lower()

          category_map = {
              "gd": "games",
              "gda": "apps",
              "gdc": "apps",
              "gdd": "apps",
              "gde": "apps",
              "gdg": "apps",
              "gdk": "apps",
              "gdl": "apps",
              "ac": "dlc",
              "gaddon": "dlc",
              "gp": "updates",
              "gpatch": "updates",
              "gup": "updates",
              "gpc": "updates",
              "gpd": "updates",
              "gpe": "updates",
              "gpk": "updates",
              "gpl": "updates",
          }

          category = category_map.get(pkg_category)
              if not category:
                  print(f"SKIP: unknown PKG CATEGORY {pkg_category!r}; refusing to guess.")
                  continue

          subcategory = None
          if category == "apps" and title_id:
              for source_name in ("applications", "homebrew"):
                  url = (
                      "https://raw.githubusercontent.com/ohhsodead/"
                      f"arisen-studio-database/main/PS4/{source_name}.json"
                  )
                  try:
                      response = session.get(url, timeout=60)
                      response.raise_for_status()
                      payload = response.json()
                  except requests.RequestException as exc:
                      print(f"Classification source unavailable: {source_name}: {exc}")
                      continue

                  for record in payload.get("Mods", []):
                      if str(record.get("TitleId") or "").strip().upper() != title_id:
                          continue

                      category_id = str(
                          record.get("CategoryId") or ""
                      ).strip().lower()

                      if category_id in {"emu", "emulator"}:
                          category = "emulators"
                      elif category_id == "media":
                          subcategory = "Media"
                      elif category_id in {"util", "utili", "utility"}:
                          subcategory = "Utility"
                      elif source_name == "homebrew":
                          category = "homebrew"
                      break

                  if category != "apps" or subcategory:
                      break

          if requested_path:
              path_in_repo = requested_path.strip("/")
          else:
              if category == "games":
                  folder = "Game"
              elif category == "apps":
                  folder = subcategory or "Application"
              elif category == "emulators":
                  folder = "Emulator"
              elif category == "homebrew":
                  folder = "Homebrew"
              elif category == "dlc":
                  folder = "DLC"
              elif category == "updates":
                  folder = "Update"
              else:
                  raise SystemExit(f"No destination folder for category {category!r}")
              path_in_repo = f"{folder}/{filename}"

          if not repo_id:
              repo_id = (
                  "dinos17/PS-Games-Dataset"
                  if category == "games"
                  else "dinos17/PS-Applications"
              )

          print(f"Title: {title}")
          print(f"Title ID: {title_id}")
          print(f"PKG CATEGORY: {pkg_category}")
          print(f"Resolved category: {category}")
          print(f"HF destination: {repo_id}/{path_in_repo}")
          print("Streaming directly from source to Hugging Face; no PKG is stored on GitHub.")

          api = HfApi(token=token)
          operation = CommitOperationAdd(
              path_in_repo=path_in_repo,
              path_or_fileobj=remote,
          )
          api.create_commit(
              repo_id=repo_id,
              repo_type="dataset",
              operations=[operation],
              commit_message=f"Upload {filename}",
          )

              print(f"Uploaded {path_in_repo} to {repo_id}")

          print("\nAll Archive.org collections processed.")
          PY
