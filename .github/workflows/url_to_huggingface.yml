name: Upload Archive.org Collections to Hugging Face

on:
  workflow_dispatch:
    inputs:
      source_collection:
        description: "Archive.org collection to process"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ps4-fpkg-collection-english-t
          - ps4-fpkg-collection-english-d
      hf_repo:
        description: "Optional Hugging Face repository override"
        required: false
        default: ""
        type: string
      hf_path:
        description: "Optional exact destination path (single-file mode only)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Stream Archive.org PKGs to Hugging Face
        env:
          SOURCE_COLLECTION: ${{ inputs.source_collection }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo }}
          HF_PATH: ${{ inputs.hf_path }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check huggingface_hub requests
          python tools/archive_to_hf.py
