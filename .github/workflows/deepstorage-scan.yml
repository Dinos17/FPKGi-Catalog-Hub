name: DeepStorage Catalog Sync

on:
  workflow_dispatch:
    inputs:
      share_username:
        description: Public-share username
        required: true
        default: fallen
        type: string
      folder_path:
        description: PS4 folder to scan (PS4/Games/ or PS4/DLC/)
        required: true
        default: PS4/Games/
        type: string
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deepstorage-catalog-sync
  cancel-in-progress: false

jobs:
  scan-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependency
        run: python -m pip install requests

      - name: Scan DeepStorage public folder
        env:
          SHARE_USERNAME: ${{ inputs.share_username || 'fallen' }}
          SHARE_PATH: ${{ inputs.folder_path || 'PS4/Games/' }}
        run: |
          python tools/deepstorage_scanner.py \
            --username "$SHARE_USERNAME" \
            --path "$SHARE_PATH" \
            --output reports/deepstorage-scan.json

      - name: Compare inventory with existing catalogs
        run: |
          CATALOG_COMMIT="$(git rev-parse HEAD)"
          python tools/deepstorage_catalog_compare.py \
            --scan-report reports/deepstorage-scan.json \
            --catalog-root . \
            --catalog-commit "$CATALOG_COMMIT" \
            --output reports/deepstorage-comparison.json

      - name: Extract and synchronize verified PS4 packages
        run: |
          python tools/deepstorage_catalog_sync.py \
            --scan-report reports/deepstorage-scan.json \
            --catalog-root . \
            --output reports/deepstorage-catalog-sync.json

      - name: Validate all catalog files
        run: python tools/validate_catalogs.py

      - name: Create or update catalog pull request
        id: catalog_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/deepstorage-catalog-sync
          delete-branch: false
          commit-message: "chore(catalog): sync verified DeepStorage packages"
          title: "Update catalog from verified DeepStorage packages"
          body: |
            ## DeepStorage catalog synchronization

            This pull request contains only catalog changes produced by the guarded DeepStorage sync workflow.

            - New PS4 packages are added only after bounded Range-based PKG metadata extraction and structural validation.
            - Uniquely matched non-Mocha entries may have their source URL replaced with the DeepStorage URL.
            - Ambiguous, conflicting, malformed, incomplete, and structurally invalid packages are skipped.
            - Existing Mocha registrations are protected.
            - No PKG binaries are downloaded.
            - No Archive.org requests are made by the DeepStorage metadata reader.
            - This workflow never merges the pull request automatically.

            Review the Actions run summary and `deepstorage-catalog-sync.json` artifact before merging.
          add-paths: |
            ps4/games.json
            ps4/dlc.json

      - name: Display scan and catalog proposal summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              output.write("# DeepStorage catalog synchronization\n\n")
              for filename, heading in (
                  ("deepstorage-scan.json", "Inventory"),
                  ("deepstorage-comparison.json", "Catalog comparison"),
                  ("deepstorage-catalog-sync.json", "Catalog changes"),
              ):
                  path = Path("reports") / filename
                  output.write(f"## {heading}\n\n")
                  if not path.is_file():
                      output.write("Report not generated; inspect the failed workflow step.\n\n")
                      continue
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError) as exc:
                      output.write(f"Could not read report: {exc}\n\n")
                      continue
                  if filename == "deepstorage-scan.json":
                      output.write(f"- Scan complete: **{data.get('scan_complete')}**\n")
                      output.write(f"- Folder: `{data.get('folder_path')}`\n")
                      output.write(f"- Files: **{data.get('file_count', 0)}**\n")
                      output.write(f"- Listing pages: **{data.get('listing_page_count', 0)}**\n\n")
                  elif filename == "deepstorage-comparison.json":
                      output.write("| Comparison status | Count |\n|---|---:|\n")
                      for key, value in data.get("counts", {}).items():
                          output.write(f"| {key.replace('_', ' ')} | {value} |\n")
                      output.write("\n")
                  else:
                      output.write(f"- Catalog files changed: **{', '.join(data.get('changed_catalogs', [])) or 'None'}**\n")
                      output.write(f"- Working-tree catalog write: **{data.get('catalog_write_performed')}**\n")
                      output.write("- Package binaries downloaded: **No**\n")
                      output.write("- Binary integrity cryptographically verified: **No**\n\n")
                      output.write("| Result | Package | Reason |\n|---|---|---|\n")
                      for row in data.get("results", []):
                          name = str(row.get("name", "unnamed")).replace("|", "\\|")
                          reason = str(row.get("reason", "")).replace("|", "\\|").replace("\n", " ")
                          output.write(f"| {row.get('status', 'unknown')} | {name} | {reason} |\n")
                      if not data.get("results"):
                          output.write("| — | No PKG files found | — |\n")
                      output.write("\n")
          PY

      - name: Upload scan and sync reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepstorage-catalog-sync-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
