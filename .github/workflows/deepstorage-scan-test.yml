name: DeepStorage Scanner Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scanner branch
        uses: actions/checkout@v4
        with:
          ref: feature/deepstorage-scanner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependency
        run: python -m pip install requests

      - name: Run read-only scan
        run: |
          python tools/deepstorage_scanner.py \
            --username fallen \
            --path "PS4/Games/" \
            --output reports/deepstorage-scan.json

      - name: Read one PKG remotely using HTTP Range
        run: |
          python tools/pkg_remote_metadata.py \
            --source "https://share.deepstorage.dev/91be0fdbedb6a37d47530386c9d135e4/RESOGUN%20-%20%5BUS%5D%20%5BEN%5D%20%5B1.10%5D.pkg" \
            --platform PS4 \
            --output reports/deepstorage-resogun-metadata.json

      - name: Compare scan with FPKGi catalogs
        run: |
          CATALOG_COMMIT="$(git rev-parse HEAD)"
          python tools/deepstorage_catalog_compare.py \
            --scan-report reports/deepstorage-scan.json \
            --catalog-root . \
            --catalog-commit "$CATALOG_COMMIT" \
            --output reports/deepstorage-comparison.json

      - name: Display scan reports in the workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          reports = sorted(Path("reports").glob("deepstorage-*.json"))
          with summary.open("a", encoding="utf-8") as output:
              output.write("# DeepStorage scan results\n\n")
              if not reports:
                  output.write("No report files were generated. Check the job logs for the failure.\n")
              for report in reports:
                  output.write(f"## {report.name}\n\n")
                  try:
                      data = json.loads(report.read_text(encoding="utf-8"))
                      output.write("```json\n")
                      output.write(json.dumps(data, indent=2, ensure_ascii=False))
                      output.write("\n```\n\n")
                  except Exception as error:
                      output.write(f"Could not read report: {error}\n\n")
          PY
