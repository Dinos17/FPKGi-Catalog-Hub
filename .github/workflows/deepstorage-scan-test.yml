name: DeepStorage Scanner Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deepstorage-scan-test.yml"
      - "tools/deepstorage_scanner.py"
      - "tools/deepstorage_catalog_compare.py"

permissions:
  contents: read

concurrency:
  group: deepstorage-scanner-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependency
        run: python -m pip install requests

      - name: Recursively inventory fixed DeepStorage PS4 and PS5 trees
        run: |
          python tools/deepstorage_scanner.py \
            --output reports/deepstorage-scan.json

      - name: Compare inventory with main catalogs
        run: |
          CATALOG_COMMIT="$(git rev-parse HEAD)"
          python tools/deepstorage_catalog_compare.py \
            --scan-report reports/deepstorage-scan.json \
            --catalog-root . \
            --catalog-commit "$CATALOG_COMMIT" \
            --output reports/deepstorage-comparison.json

      - name: Display read-only validation summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              output.write("# DeepStorage read-only validation\n\n")
              scan_path = Path("reports/deepstorage-scan.json")
              compare_path = Path("reports/deepstorage-comparison.json")
              if scan_path.is_file():
                  scan = json.loads(scan_path.read_text(encoding="utf-8"))
                  output.write(f"- Scan complete: **{scan.get('scan_complete')}**\n")
                  output.write(f"- Folder: `{scan.get('folder_path')}`\n")
                  output.write(f"- Files: **{scan.get('file_count', 0)}**\n")
                  output.write(f"- Listing pages: **{scan.get('listing_page_count', 0)}**\n")
                  output.write("- Package binaries downloaded: **No**\n")
                  output.write("- Catalog writes: **No**\n\n")
              else:
                  output.write("Scan report was not generated.\n\n")
              if compare_path.is_file():
                  report = json.loads(compare_path.read_text(encoding="utf-8"))
                  output.write("## Catalog comparison\n\n")
                  output.write("| Status | Count |\n|---|---:|\n")
                  for key, value in report.get("counts", {}).items():
                      output.write(f"| {key.replace('_', ' ')} | {value} |\n")
                  output.write("\n")
                  output.write("| File | Status | Reason |\n|---|---|---|\n")
                  for row in report.get("results", []):
                      name = str(row.get("name", "unnamed")).replace("|", "\\|")
                      reason = str(row.get("reason", "")).replace("|", "\\|").replace("\n", " ")
                      output.write(f"| {name} | {row.get('status', 'unknown')} | {reason} |\n")
              else:
                  output.write("Catalog comparison report was not generated.\n")
          PY

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepstorage-validation-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
