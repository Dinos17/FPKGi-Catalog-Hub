name: DeepStorage Scanner Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scanner branch
        uses: actions/checkout@v4
        with:
          ref: feature/deepstorage-scanner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependency
        run: python -m pip install requests

      - name: Run read-only scan
        run: |
          python tools/deepstorage_scanner.py \
            --username fallen \
            --path "PS4/Games/" \
            --output reports/deepstorage-scan.json

      - name: Read one PKG remotely using HTTP Range
        run: |
          python tools/pkg_remote_metadata.py \
            --source "https://share.deepstorage.dev/91be0fdbedb6a37d47530386c9d135e4/RESOGUN%20-%20%5BUS%5D%20%5BEN%5D%20%5B1.10%5D.pkg" \
            --platform PS4 \
            --output reports/deepstorage-resogun-metadata.json

      - name: Compare scan with FPKGi catalogs
        run: |
          CATALOG_COMMIT="$(git rev-parse HEAD)"
          python tools/deepstorage_catalog_compare.py \
            --scan-report reports/deepstorage-scan.json \
            --catalog-root . \
            --catalog-commit "$CATALOG_COMMIT" \
            --output reports/deepstorage-comparison.json

      - name: Verify DmC remote sizes with HTTP Range requests
        if: always()
        run: |
          python - <<'PY'
          import json
          import re
          from urllib.parse import urlparse, urljoin
          from pathlib import Path
          import requests

          targets = [
              {
                  "name": "DeepStorage DmC EU 1.03",
                  "url": "https://share.deepstorage.dev/16773e155f681f88d210088c77f6e816/DmC%20Devil%20May%20Cry%20-%20%5BEU%5D%20%5BEN%5D%20%5B1.03%5D.pkg",
                  "listing_size_bytes": 3648601580,
              },
              {
                  "name": "Archive.org catalog DmC EU 1.03",
                  "url": "https://archive.org/download/ps4-fpkg-collection-english-d/DmC%20Devil%20May%20Cry%20-%20%5BEU%5D%20%5BEN%5D%20%5B1.03%5D.pkg",
                  "catalog_size_bytes": 17599102976,
              },
          ]

          def allowed(host, initial_host):
              host = (host or "").lower().rstrip(".")
              if initial_host == "share.deepstorage.dev":
                  return host == "share.deepstorage.dev"
              return host == "archive.org" or host.endswith(".archive.org")

          results = []
          for item in targets:
              initial_host = urlparse(item["url"]).hostname
              current = item["url"]
              result = {key: value for key, value in item.items() if key != "url"}
              result["url"] = item["url"]
              result["http_status"] = None
              result["server_size_bytes"] = None
              result["content_range"] = None
              result["content_length"] = None
              result["accept_ranges"] = None
              result["final_url"] = None
              result["error"] = None
              try:
                  for redirect_count in range(4):
                      parsed = urlparse(current)
                      if parsed.scheme != "https" or not allowed(parsed.hostname, initial_host):
                          raise RuntimeError(f"Redirect blocked: host/scheme not allowlisted ({parsed.hostname})")
                      response = requests.get(
                          current, headers={"Range": "bytes=0-0"},
                          stream=True, allow_redirects=False, timeout=(15, 30)
                      )
                      if response.status_code in (301, 302, 303, 307, 308):
                          location = response.headers.get("Location")
                          response.close()
                          if not location:
                              raise RuntimeError("Redirect response missing Location")
                          current = urljoin(current, location)
                          continue
                      result["http_status"] = response.status_code
                      result["final_url"] = current
                      result["content_range"] = response.headers.get("Content-Range")
                      result["content_length"] = response.headers.get("Content-Length")
                      result["accept_ranges"] = response.headers.get("Accept-Ranges")
                      if response.status_code == 206:
                          match = re.fullmatch(r"bytes\s+0-0/(\d+)", response.headers.get("Content-Range", ""), re.I)
                          if not match:
                              raise RuntimeError("206 response had unexpected Content-Range")
                          result["server_size_bytes"] = int(match.group(1))
                          # Read at most one byte, then close; never stream the PKG.
                          response.raw.read(1)
                      else:
                          raise RuntimeError(f"Expected HTTP 206 for one-byte Range; received {response.status_code}")
                      response.close()
                      break
                  else:
                      raise RuntimeError("Too many redirects")
              except Exception as exc:
                  result["error"] = str(exc)
              results.append(result)

          Path("reports").mkdir(exist_ok=True)
          Path("reports/deepstorage-remote-size-check.json").write_text(
              json.dumps({"read_only": True, "full_package_downloaded": False, "results": results}, indent=2),
              encoding="utf-8"
          )
          print(json.dumps(results, indent=2))
          PY

      - name: Display scan reports in the workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          reports = sorted(Path("reports").glob("deepstorage-*.json"))
          with summary.open("a", encoding="utf-8") as output:
              output.write("# DeepStorage scan results\n\n")
              if not reports:
                  output.write("No report files were generated. Check the job logs for the failure.\n")
              for report in reports:
                  output.write(f"## {report.name}\n\n")
                  try:
                      data = json.loads(report.read_text(encoding="utf-8"))
                      if report.name == "deepstorage-remote-size-check.json":
                          output.write("| File | HTTP | Server size | Listed/catalog size | Difference | Accept-Ranges | Error |\\n|---|---:|---:|---:|---:|---|---|\\n")
                          for item in data.get("results", []):
                              server_size = item.get("server_size_bytes")
                              reference_size = item.get("listing_size_bytes", item.get("catalog_size_bytes"))
                              delta = server_size - reference_size if isinstance(server_size, int) and isinstance(reference_size, int) else None
                              output.write(
                                  f"| {item.get('name')} | {item.get('http_status') or '—'} | "
                                  f"{server_size:,} | {reference_size:,} | "
                                  f"{delta:+,} | {item.get('accept_ranges') or '—'} | "
                                  f"{item.get('error') or '—'} |\\n"
                                  if isinstance(server_size, int) and isinstance(reference_size, int)
                                  else f"| {item.get('name')} | {item.get('http_status') or '—'} | {server_size or '—'} | {reference_size or '—'} | — | {item.get('accept_ranges') or '—'} | {item.get('error') or 'Size unavailable'} |\\n"
                              )
                          output.write("\\nOnly a one-byte Range request is used; full PKG downloads are not performed.\\n\\n")
                      elif report.name == "deepstorage-comparison.json":
                          counts = data.get("counts", {})
                          output.write("| Result | Count |\n|---|---:|\n")
                          for key, value in counts.items():
                              output.write(f"| {key.replace('_', ' ')} | {value} |\n")
                          output.write("\n### Items requiring review\n\n")
                          flagged = [
                              row for row in data.get("results", [])
                              if row.get("status") not in {"matched"}
                          ]
                          if not flagged:
                              output.write("No flagged items.\n\n")
                          for row in flagged:
                              output.write(f"**{row.get('status', 'unknown')}: {row.get('name', 'unnamed')}**\n\n")
                              output.write(f"- Reason: {row.get('reason', 'Not provided')}\n")
                              differences = row.get("metadata_differences", [])
                              output.write(f"- Differences: {', '.join(differences) or 'None'}\n")
                              if "size_bytes" in differences:
                                  source_size = (row.get("source_metadata") or {}).get("size_bytes")
                                  catalog_size = (row.get("catalog_metadata") or {}).get("size")
                                  if isinstance(source_size, int) and isinstance(catalog_size, int):
                                      delta = source_size - catalog_size
                                      output.write(f"- DeepStorage size: {source_size:,} bytes\n")
                                      output.write(f"- Catalog size: {catalog_size:,} bytes\n")
                                      output.write(f"- Size difference: {delta:+,} bytes\n")
                                  else:
                                      output.write("- Size comparison: one or both size values are unavailable\n")
                              output.write(f"- Source: {row.get('deepstorage_url', 'Not available')}\n")
                              output.write(f"- Catalog: {row.get('catalog_url') or 'No unique catalog match'}\n\n")
                      else:
                          output.write("```json\n")
                          output.write(json.dumps(data, indent=2, ensure_ascii=False))
                          output.write("\n```\n\n")
                  except Exception as error:
                      output.write(f"Could not read report: {error}\n\n")
          PY
