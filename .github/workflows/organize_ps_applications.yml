name: Organize PS Datasets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organize:
    runs-on: ubuntu-24.04
    steps:
      - name: Organize Hugging Face datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python -m pip install --disable-pip-version-check huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, CommitOperationCopy, CommitOperationDelete

          api = HfApi(token=os.environ["HF_TOKEN"])

          datasets = {
              "dinos17/PS-Applications": "Media",
              "dinos17/PS-Games-Dataset": "Games",
          }

          for repo, folder in datasets.items():
              files = [
                  path
                  for path in api.list_repo_files(repo_id=repo, repo_type="dataset")
                  if path.lower().endswith(".pkg") and "/" not in path
              ]

              if not files:
                  print(f"{repo}: no root-level PKG files need organizing.")
                  continue

              operations = []
              for path in files:
                  operations.append(
                      CommitOperationCopy(
                          src_path_in_repo=path,
                          path_in_repo=f"{folder}/{path}",
                      )
                  )
                  operations.append(CommitOperationDelete(path_in_repo=path))

              api.create_commit(
                  repo_id=repo,
                  repo_type="dataset",
                  operations=operations,
                  commit_message=f"Organize root PKG files into {folder}/",
              )

              print(f"{repo}: moved {len(files)} root PKG file(s) into {folder}/.")
          PY
