name: Record AkiraBox Rejection

on:
  issues:
    types: [opened]

concurrency:
  group: akirabox-rejection-${{ github.event.issue.number }}
  queue: max

permissions:
  contents: read

jobs:
  record-rejection:
    if: github.event.issue.user.login == 'Dinos17' && startsWith(github.event.issue.title, 'AkiraBox rejection:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Load current rejection records
        env:
          REPORT_BRANCH: mocha
          REPORT_PATH: ${{ runner.temp }}/akirabox-rejections.json
        run: |
          set -euo pipefail
          git fetch origin "$REPORT_BRANCH"
          if git cat-file -e "FETCH_HEAD:reports/akirabox-rejections.json" 2>/dev/null; then
            git show "FETCH_HEAD:reports/akirabox-rejections.json" > "$REPORT_PATH"
          fi

      - name: Validate and record rejection
        env:
          EVENT_PATH: ${{ github.event_path }}
          REPORT_PATH: ${{ runner.temp }}/akirabox-rejections.json
        run: |
          set -euo pipefail
          python tools/akirabox_rejections.py --event-path "$EVENT_PATH" --report-path "$REPORT_PATH" --expected-actor "Dinos17"

      - name: Sanitize report and remove private payload from issue
        env:
          REPORT_PATH: ${{ runner.temp }}/akirabox-rejections.json
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["REPORT_PATH"])
          report = json.loads(path.read_text(encoding="utf-8"))
          safe_keys = {"name", "platform", "catalog_category", "scan_generated_at", "rejected_at", "status"}
          safe_records = []
          for item in report.get("records", []):
              if not isinstance(item, dict):
                  continue
              safe = {key: item[key] for key in safe_keys if key in item}
              if isinstance(safe.get("name"), str) and safe["name"].strip():
                  safe_records.append(safe)
          path.write_text(json.dumps({"schema_version": 1, "records": safe_records}, indent=2, ensure_ascii=False) + chr(10), encoding="utf-8")
          PY

      - name: Publish sanitized rejection record
        env:
          REPORT_BRANCH: mocha
          REPORT_PATH: ${{ runner.temp }}/akirabox-rejections.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$REPORT_BRANCH"
            git reset --hard FETCH_HEAD
            mkdir -p reports
            cp "$REPORT_PATH" reports/akirabox-rejections.json
            git add reports/akirabox-rejections.json
            if git diff --cached --quiet; then
              echo "Sanitized rejection records are already current."
              exit 0
            fi
            git commit -m "Publish sanitized AkiraBox rejection records"
            if git push origin "HEAD:$REPORT_BRANCH"; then exit 0; fi
            echo "Reports branch advanced; retrying (attempt $attempt/3)." >&2
          done
          echo "Could not publish rejection records after 3 attempts." >&2
          exit 1

      - name: Remove private upload payload from the public issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "This AkiraBox rejection was recorded. The original upload identifier and share URL have been removed from the issue body. The dashboard records the filename and rejection metadata only. Catalog references have not been verified; do not delete the upload based on this record."
