name: Rebuild split Hugging Face PKG as one Xet file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install current Hugging Face Xet streaming client
        run: python -m pip install --upgrade --disable-pip-version-check "huggingface_hub>=1.20" "hf_xet>=1.5" requests

      - name: Stream existing parts into one Xet-backed file
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_XET_HIGH_PERFORMANCE: "1"
        run: |
          set -euo pipefail
          python -u tools/rebuild_hf_split_pkg.py
