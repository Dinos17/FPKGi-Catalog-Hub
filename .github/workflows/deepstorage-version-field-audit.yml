name: DeepStorage Version Field Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepstorage-version-field-audit
  cancel-in-progress: false

jobs:
  inspect-fixed-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded HTTP client
        run: python -m pip install requests

      - name: Run bounded metadata-only audit
        run: python tools/deepstorage_version_field_audit.py

      - name: Publish audit summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          from deepstorage_version_field_audit import markdown_cell

          path = Path("reports/deepstorage-version-field-audit.json")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("# DeepStorage PS4 version-field audit\\n\\n")
              if not path.is_file():
                  out.write("No report produced; inspect the audit step.\\n")
                  raise SystemExit(0)
              report = json.loads(path.read_text(encoding="utf-8"))
              out.write(f"- Status: **{report['status']}**\\n")
              out.write(f"- Packages: **{report['packages_succeeded']}/{report['packages_targeted']}**\\n")
              out.write(f"- Completed: **{report['packages_completed']}/{report['packages_targeted']}**\\n")
              out.write(f"- Total bytes fetched: **{report['total_bytes_requested']}**\\n")
              out.write("- Full package downloads: **None**\\n")
              out.write("- Catalog modifications: **None**\\n\\n")
              out.write("| Package | Filename | CATEGORY | VERSION | APP_VER | Result |\\n")
              out.write("|---|---:|---|---|---|---|\\n")
              for item in report["results"]:
                  cells = [markdown_cell(item.get(k)) for k in (
                      "package", "filename_version", "category", "version", "app_ver", "status"
                  )]
                  out.write("| " + " | ".join(cells) + " |\\n")
                  if item.get("error"):
                      out.write(f"\\n- {markdown_cell(item['package'])}: {markdown_cell(item['error'])}\\n")

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepstorage-version-field-audit
          path: reports/deepstorage-version-field-audit.json
          if-no-files-found: warn
          retention-days: 7
