name: Remote PKG Metadata Tests

on:
  pull_request:
    paths:
      - "tools/pkg_remote_metadata.py"
      - "tools/pkg_metadata_repair.py"
      - "tools/mocha_remote_pkg_upload.py"
      - "tests/test_mocha_remote_pkg_upload.py"
      - "tests/test_pkg_remote_metadata.py"
      - "tests/test_pkg_metadata_repair.py"
      - "requirements.txt"
      - ".github/workflows/pkg-metadata-tests.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97d
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest==8.4.2"
      - name: Run tests
        run: python -m pytest -q
      - name: Extract incomplete-record metadata using bounded HTTP ranges
        run: |
          python tools/pkg_remote_metadata.py --catalog-root . --output "$RUNNER_TEMP/pkg-metadata-report.json"
      - name: Validate PS4 parser against a real Mocha package (bounded ranges only)
        env:
          MOCHA_API_KEY: ${{ secrets.MOCHA_API_KEY }}
        run: |
          python tools/pkg_remote_metadata.py \
            --source "d5ac3913-802b-4d68-9803-8f5c07c7640e" \
            --platform PS4 \
            --output "$RUNNER_TEMP/real-ps4-pkg-smoke.json"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "real-ps4-pkg-smoke.json")
          with open(path, encoding="utf-8") as stream:
              report = json.load(stream)
          file_id = "d5ac3913-802b-4d68-9803-8f5c07c7640e"
          results = report.get("results")
          if not isinstance(results, list) or len(results) != 1:
              raise SystemExit("Direct-source smoke must return exactly one result")
          result = results[0]
          if result.get("catalog") != "direct-source" or result.get("source") != file_id:
              raise SystemExit("Smoke report does not describe the requested Mocha file ID")
          if result.get("status") != "extracted":
              raise SystemExit(f"Real PS4 PKG extraction failed: {result.get('reason', result.get('status'))}")
          required = ("title_id", "name", "version", "package_size")
          missing = [key for key in required if not result.get(key)]
          if missing:
              raise SystemExit(f"Real PS4 PKG extraction omitted required fields: {missing}")
          with open("ps4/games.json", encoding="utf-8") as stream:
              catalog = json.load(stream)["DATA"]
          expected = catalog.get(file_id)
          if not isinstance(expected, dict):
              raise SystemExit("Real-package smoke fixture is no longer registered in ps4/games.json")
          mapping = {"title_id": "title_id", "name": "name",
                     "version": "version", "package_size": "size"}
          mismatches = {
              extracted: {"expected": expected.get(catalog_key),
                          "actual": result.get(extracted)}
              for extracted, catalog_key in mapping.items()
              if expected.get(catalog_key) != result.get(extracted)
          }
          if mismatches:
              raise SystemExit(f"Real PKG metadata disagrees with catalog: {json.dumps(mismatches, sort_keys=True)}")
          print(json.dumps({key: result.get(key) for key in required}, indent=2))
          PY
      - name: Upload real-package smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-ps4-pkg-smoke-report
          path: ${{ runner.temp }}/real-ps4-pkg-smoke.json
          if-no-files-found: error
          retention-days: 3
      - name: Upload read-only extraction report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: incomplete-pkg-metadata-report
          path: ${{ runner.temp }}/pkg-metadata-report.json
          if-no-files-found: error
          retention-days: 3
