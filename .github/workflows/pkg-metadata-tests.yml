name: Remote PKG Metadata Tests

on:
  pull_request:
    paths:
      - "tools/pkg_remote_metadata.py"
      - "tests/test_pkg_remote_metadata.py"
      - "requirements.txt"
      - ".github/workflows/pkg-metadata-tests.yml"
  push:
    branches:
      - main
    paths:
      - "tools/pkg_remote_metadata.py"
      - "tests/test_pkg_remote_metadata.py"
      - "requirements.txt"
      - ".github/workflows/pkg-metadata-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97d
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest==8.4.2"
      - name: Run tests
        run: python -m pytest -q
