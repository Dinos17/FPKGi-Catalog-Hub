name: Auto Merge FPKGi JSONs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnose JSON Structure
        run: |
          node -e '
          async function check() {
            const res = await fetch("https://archive.org/download/ps4-fpkg-collection-english-fpkgi/GAMES.json");
            const json = await res.json();
            console.log("GAMES.json keys:", Object.keys(json));
            if (!Array.isArray(json)) {
              const firstKey = Object.keys(json)[0];
              console.log("First key sample:", firstKey, Array.isArray(json[firstKey]) ? "is array with length " + json[firstKey].length : "not array");
            }
          }
          check();
          '
