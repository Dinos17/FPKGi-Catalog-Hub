name: Auto Merge FPKGi JSONs

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: fpkgi-catalog-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run FPKGi Merger
        run: |
          python tools/merge.py

      - name: Validate Generated Catalogs
        run: |
          python tools/validate_catalogs.py

      - name: Prepare Catalog Build Artifacts
        run: |
          python tools/catalog_pipeline.py prepare --artifact build-artifacts

      - name: Upload Catalog Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-build-artifacts
          path: build-artifacts/*.json
          if-no-files-found: error

  publish:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Catalog Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: catalog-build-artifacts
          path: build-artifacts

      - name: Apply Catalog Build Artifacts
        run: |
          python tools/catalog_pipeline.py apply --artifact build-artifacts

      - name: Check for Catalog Changes
        id: changes
        run: |
          python - <<'PY'
          import json
          import subprocess

          with open("config/sources.json", "r", encoding="utf-8") as file:
              categories = json.load(file)

          files = ["ps5.json"]
          for category in categories:
              files.extend(
                  (f"{category}.json", f"ps5-{category}.json")
              )

          subprocess.run(
              ["git", "add", "-A", "--", "*.json"],
              check=True,
          )
          PY

          if git diff --cached --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"

            echo "### ℹ️ FPKGi Auto Merge" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Status:** Success" >> "$GITHUB_STEP_SUMMARY"
            echo "**Catalog changes:** None" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No catalog records or catalog files changed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"

            python tools/catalog_diff.py >> "$GITHUB_STEP_SUMMARY"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update merged FPKGi catalogs"
            git push
          fi

      - name: Report Failure
        if: ${{ failure() }}
        run: |
          echo "### ❌ FPKGi Auto Merge — Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above for details." >> "$GITHUB_STEP_SUMMARY"
