name: Auto Merge FPKGi JSONs

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          python -m pip install requests

      - name: Run FPKGi Merger
        run: |
          python tools/merge.py

      - name: Check for Catalog Changes
        id: changes
        run: |
          git add *.json

          if git diff --cached --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"

            echo "### ℹ️ FPKGi Auto Merge" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Status:** Success" >> "$GITHUB_STEP_SUMMARY"
            echo "**JSON catalogs updated:** No" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No catalog changes were detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"

            echo "### ✅ FPKGi Auto Merge" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Status:** Success" >> "$GITHUB_STEP_SUMMARY"
            echo "**JSON catalogs updated:** Yes" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Updated files:**" >> "$GITHUB_STEP_SUMMARY"

            git diff --cached --name-only -- '*.json' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update merged FPKGi catalogs"
            git push
          fi

      - name: Report Failure
        if: ${{ failure() }}
        run: |
          echo "### ❌ FPKGi Auto Merge — Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above for details." >> "$GITHUB_STEP_SUMMARY"
