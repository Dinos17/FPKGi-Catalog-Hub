name: Auto Merge FPKGi JSONs

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Community FPKGi Merger Script
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const fetchUrl = (url) => new Promise((resolve) => {
            https.get(url, (res) => {
              let data = "";
              res.on("data", (chunk) => data += chunk);
              res.on("end", () => {
                try {
                  const json = JSON.parse(data);
                  resolve(Array.isArray(json) ? json : (json.DATA || json.games || []));
                } catch (e) { resolve([]); }
              });
            }).on("error", () => resolve([]));
          });

          async function processCategory(filename, urls) {
            let combined = [];
            for (const url of urls) {
              const list = await fetchUrl(url);
              combined = combined.concat(list);
            }
            // Αφαίρεση διπλότυπων βάσει title_id / name
            const unique = Array.from(new Map(combined.map(item => [item.title_id || item.name || Math.random(), item])).values());
            
            // Αποθήκευση με το σωστό "DATA" wrapper που ζητάει το FPKGi
            fs.writeFileSync(filename, JSON.stringify({ DATA: unique }, null, 2));
          }

          // Λίστα πηγών για συγχώνευση
          processCategory("games.json", [
            "https://raw.githubusercontent.com/GAMES-archive/main/games.json"
          ]);
          '

      - name: Commit & Push updated JSONs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update merged FPKGi JSON files" && git push)
