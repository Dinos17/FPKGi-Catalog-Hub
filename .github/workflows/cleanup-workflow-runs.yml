name: Cleanup Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import subprocess
          import time

          repo = os.environ["REPO"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          batch_size = 25
          max_workers = 3
          max_attempts = 5

          def gh_api(*args, allow_404=False):
              for attempt in range(max_attempts):
                  try:
                      result = subprocess.run(
                          ["gh", "api", *args],
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )
                      if result.returncode == 0:
                          return result.stdout
                      error = (result.stderr or result.stdout).strip()
                  except subprocess.TimeoutExpired:
                      error = "GitHub CLI request timed out after 60 seconds"

                  if allow_404 and ("HTTP 404" in error or "404 Not Found" in error):
                      return None

                  lowered = error.lower()
                  transient = any(
                      marker in lowered
                      for marker in (
                          "429", "500", "502", "503", "504",
                          "rate limit", "timeout", "timed out",
                          "connection reset", "connection refused",
                          "temporarily unavailable", "tls handshake",
                      )
                  )
                  if not transient or attempt == max_attempts - 1:
                      raise RuntimeError(error or "GitHub API request failed")

                  delay = min(2 ** (attempt + 1), 30)
                  print(
                      f"Temporary GitHub API error; retrying in {delay}s "
                      f"(attempt {attempt + 2}/{max_attempts}).",
                      flush=True,
                  )
                  time.sleep(delay)

          def delete_run(run_id):
              gh_api(
                  "--silent",
                  "--method", "DELETE",
                  f"repos/{repo}/actions/runs/{run_id}",
                  allow_404=True,
              )
              return run_id

          # Snapshot all run IDs before deleting. This avoids pagination shifting
          # when runs are removed and ensures skipped 403 runs cannot block progress.
          run_ids = []
          page = 1
          while True:
              response = gh_api(
                  f"repos/{repo}/actions/runs?per_page=100&page={page}"
              )
              runs = json.loads(response).get("workflow_runs", [])
              run_ids.extend(
                  int(run["id"])
                  for run in runs
                  if int(run["id"]) != current_run_id
              )
              if len(runs) < 100:
                  break
              page += 1

          print(f"Found {len(run_ids)} workflow runs to process.", flush=True)

          deleted = 0
          skipped_403 = []
          failures = []

          for offset in range(0, len(run_ids), batch_size):
              batch = run_ids[offset:offset + batch_size]
              print(
                  f"Processing batch of {len(batch)} "
                  f"(deleted: {deleted}, skipped 403: {len(skipped_403)}).",
                  flush=True,
              )

              with concurrent.futures.ThreadPoolExecutor(
                  max_workers=max_workers
              ) as executor:
                  futures = {
                      executor.submit(delete_run, run_id): run_id
                      for run_id in batch
                  }
                  for future in concurrent.futures.as_completed(futures):
                      run_id = futures[future]
                      try:
                          future.result()
                          print(f"Deleted workflow run {run_id}", flush=True)
                          deleted += 1
                      except Exception as exc:
                          error = str(exc)
                          if "HTTP 403" in error or "403 Forbidden" in error:
                              skipped_403.append(run_id)
                              print(
                                  f"Skipped workflow run {run_id}: GitHub returned "
                                  f"HTTP 403 (insufficient permission or protected run).",
                                  flush=True,
                              )
                          else:
                              failures.append((run_id, error))
                              print(
                                  f"Failed workflow run {run_id}: {error}",
                                  flush=True,
                              )

          print(
              f"Cleanup finished. Deleted: {deleted}; "
              f"skipped (HTTP 403): {len(skipped_403)}; "
              f"other failures: {len(failures)}.",
              flush=True,
          )

          if skipped_403:
              print(
                  "Runs skipped due to HTTP 403: "
                  + ", ".join(str(run_id) for run_id in skipped_403),
                  flush=True,
              )

          if failures:
              details = "; ".join(
                  f"{run_id}: {error}" for run_id, error in failures
              )
              raise RuntimeError(
                  f"{len(failures)} non-403 deletion(s) failed after retries: {details}"
              )
          PY
