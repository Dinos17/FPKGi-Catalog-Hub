name: Replace Archive.org Links With Hugging Face

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply catalog replacements and delete HF PKGs that are not needed"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Reconcile HF PKGs With GitHub Catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python tools/replace_archive_links_with_hf.py --apply
          else
            python tools/replace_archive_links_with_hf.py
          fi

      - name: Validate Catalog JSON
        run: python tools/validate_catalogs.py

      - name: Commit Applied Changes
        if: ${{ inputs.apply == true }}
        run: |
          git add ps4/games.json ps4/apps.json ps4/dlc.json ps4/updates.json ps4/homebrew.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace Archive.org package links with Hugging Face"
          git push
